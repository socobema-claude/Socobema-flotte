<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6A49">
<title>Flotte SOCOBEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : en-tête collant + onglets, une colonne sur téléphone, grilles plus larges sur ordinateur. Ton : panneau routier, plaque d'immatriculation. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#E3E8E4; --ink:#17201C; --muted:#5A6862; --line:#D3DBD6;
  --accent:#1E6A49; --accent-ink:#FFFFFF; --signal:#E2A410; --signal-ink:#1E1600;
  --ram:#1E6A49; --ram-bg:#DDEFE5; --tra:#2B5B8C; --tra-bg:#DCE7F3;
  --ok:#1E7A45; --ok-bg:#DCF1E3; --warn:#8A5A00; --warn-bg:#FBEBC6; --bad:#B3261E; --bad-bg:#F8DEDB; --info:#2B5B8C; --info-bg:#DCE7F3;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E7EEEA; --muted:#97A59F; --line:#2E3A35;
  --accent:#4FB585; --accent-ink:#06140D; --signal:#F2B630; --signal-ink:#1E1600;
  --ram:#6CC79A; --ram-bg:#173328; --tra:#7FAEE0; --tra-bg:#182A3D;
  --ok:#6CC79A; --ok-bg:#163126; --warn:#F2C25C; --warn-bg:#3A2C0D; --bad:#F08A80; --bad-bg:#3D1916; --info:#7FAEE0; --info-bg:#182A3D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E7EEEA; --muted:#97A59F; --line:#2E3A35;
  --accent:#4FB585; --accent-ink:#06140D; --signal:#F2B630; --signal-ink:#1E1600;
  --ram:#6CC79A; --ram-bg:#173328; --tra:#7FAEE0; --tra-bg:#182A3D;
  --ok:#6CC79A; --ok-bg:#163126; --warn:#F2C25C; --warn-bg:#3A2C0D; --bad:#F08A80; --bad-bg:#3D1916; --info:#7FAEE0; --info-bg:#182A3D;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand svg{flex:none}
.brand .t{flex:1;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:1.55rem;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.sync{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok)}.sync.busy{color:var(--warn)}.sync.bad{color:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--f-disp);font-weight:600;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
main{padding-block:18px 60px}
.banner{border-radius:8px;padding:10px 12px;font-size:.86rem;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--info-bg);color:var(--info)}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warnb{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.82rem}
.btn.ghost{background:transparent}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font-size:.72rem;text-align:center;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.list{display:grid;gap:10px}
@media (min-width:760px){.list.cols{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.plate{font-family:var(--f-mono);font-weight:600;font-size:.92rem;letter-spacing:.06em;background:#FFFFFF;color:#111;border:2px solid #111;border-radius:5px;padding:1px 8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;letter-spacing:.02em;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ram{background:var(--ram-bg);color:var(--ram)}.p-tra{background:var(--tra-bg);color:var(--tra)}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mut{background:var(--sunk);color:var(--muted)}
.pill.nodot::before{display:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.84rem}
.meta b{color:var(--ink);font-weight:500}
.trace{font-size:.74rem;color:var(--muted)}
.route{font-weight:600;font-size:.98rem;overflow-wrap:anywhere}
.route span{color:var(--signal);padding:0 4px}
.num{font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.empty .btn{margin-top:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.alert:first-child{border-top:0}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.86rem;margin-bottom:8px}
.track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--signal);border-radius:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
select.status{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:4px 6px}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,13,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.msgs{grid-column:1/-1;display:grid;gap:6px}
.msgs ul{margin:0;padding:10px 12px 10px 28px;border-radius:8px;font-size:.88rem}
.msgs ul.e{background:var(--bad-bg);color:var(--bad)}.msgs ul.w{background:var(--warn-bg);color:var(--warn)}
.fld{display:grid;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
@media (max-width:480px){.fld{grid-column:1/-1}}
.fld label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;width:100%;min-width:0}
.fld [aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fld .hint{font-size:.74rem;color:var(--muted)}
.fld textarea{min-height:70px;resize:vertical}
.tool{grid-column:1/-1;display:grid;gap:8px}
.tool .item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.tool textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100vw - 32px)}
.confirm{grid-column:1/-1;font-size:.95rem;margin:0}
body.ro .w{display:none!important}
.qr-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.qr{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);width:180px;height:180px;flex:none}
.qr img,.qr canvas{width:160px!important;height:160px!important;display:block}
.linkbox{font-family:var(--f-mono);font-size:.78rem;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
.doc-cell{display:grid;gap:3px;min-width:118px}
.doc-cell .dd{font-size:.8rem;color:var(--muted)}
td.doc{vertical-align:top}
.docs-sum{display:flex;flex-wrap:wrap;gap:6px}
body:not(.locked) #v-lock{display:none}
:root{--lk-field:#F3F2EC;--lk-focus:#6B3A1E;--lk-btn:#2E5E37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lk-field:#222C28;--lk-focus:#D9A066;--lk-btn:#3E7A4A}}
:root[data-theme="dark"]{--lk-field:#222C28;--lk-focus:#D9A066;--lk-btn:#3E7A4A}
body.locked main>section:not(#v-lock),body.locked .tabs,body.locked #btn-tools,body.locked #btn-lock{display:none!important}
.lock{max-width:440px;margin:28px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px 26px;display:grid;gap:16px}
.lk-eyebrow{font-family:var(--f-body);font-size:.82rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lk-title{font-family:var(--f-body);font-weight:700;font-size:1.75rem;line-height:1.3;text-transform:none;letter-spacing:0;margin:-4px 0 0;color:var(--ink)}
.lk-f{display:grid;gap:8px}
.lk-f label{font-weight:700;font-size:.98rem;color:var(--ink)}
.lk-in{font:inherit;font-size:1.05rem;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--lk-field);color:var(--ink);padding:14px 16px;min-height:54px}
.lk-in:focus{outline:none;border:2px solid var(--lk-focus);padding:13px 15px}
.lk-pin{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.45em;min-height:64px}
.lk-btn{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:10px;background:var(--lk-btn);color:#fff;min-height:54px;cursor:pointer}
.lk-btn:disabled{opacity:.6}
.lk-btn2{font:inherit;font-weight:700;font-size:.95rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:48px;cursor:pointer}
.lk-help{margin:0;font-size:.9rem;color:var(--ink);background:var(--sunk);border-radius:10px;padding:12px}
body.locked header.top{display:none}
body.locked::before{background:var(--bg)}
.lock p{margin:0;color:var(--muted);font-size:.9rem}
.gpick{display:grid;gap:8px}
.gpick button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600}
.gpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--ram-bg)}
.pin{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.5em;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;width:100%}
.lock-err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin:0}
.code-big{grid-column:1/-1;font-family:var(--f-mono);font-size:2.4rem;font-weight:600;letter-spacing:.3em;text-align:center;background:var(--sunk);border-radius:10px;padding:14px 8px}
.who{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.card:hover{border-color:var(--muted)}}
</style>
</head>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sp=s=>s.replace(/ | /g," ");
const fcfa=n=>sp((Math.round(Number(n)||0)).toLocaleString("fr-FR"))+" FCFA";
const nb=n=>sp((Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:1}));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fdate=d=>d?new Date(d.slice(0,10)+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fdt=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const daysTo=d=>d?Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5):null;
const thisMonth=d=>d&&d.slice(0,7)===today().slice(0,7);
const normPlate=s=>String(s||"").toUpperCase().replace(/\s+/g," ").trim();
const plateKey=s=>normPlate(s).replace(/[\s\-]/g,"");

const TYPES={ramassage:{l:"Ramassage",c:"p-ram"},transport:{l:"Transport",c:"p-tra"}};
const CST={disponible:{l:"Disponible",c:"p-ok"},mission:{l:"En mission",c:"p-info"},maintenance:{l:"En maintenance",c:"p-warn"},panne:{l:"En panne",c:"p-bad"}};
const MANUAL=["disponible","maintenance","panne"];
const MST={planifiee:{l:"Planifiée",c:"p-mut"},en_cours:{l:"En cours",c:"p-info"},livree:{l:"Livrée",c:"p-ok"},annulee:{l:"Annulée",c:"p-bad"}};
const PRODUITS=["Cacao","Café","Anacarde","Maïs","Riz","Coton","Intrants","Autre"];
const CATS=["Carburant","Entretien / vidange","Réparation","Pneus","Frais de route / péage","Salaire chauffeur","Assurance","Visite technique","Autre"];

const DOCS=[["assuranceExp","Assurance","Assurance"],["visiteExp","Visite technique","Visite"],["vignetteExp","Vignette","Vignette"],["stationnementExp","Carte de stationnement","Stationnement"],["transportExp","Carte de transport","Carte transport"],["patenteExp","Patente de transport","Patente"]];
const SOON=30;
function docSt(c,k){const d=daysTo(c[k]);if(d===null)return{s:"manque",o:3,d};if(d<0)return{s:"expire",o:0,d};if(d<=SOON)return{s:"bientot",o:1,d};return{s:"ok",o:2,d}}
const DOC_PILL={manque:["p-mut","À saisir"],expire:["p-bad","Expirée"],bientot:["p-warn",""],ok:["p-ok","À jour"]};
const docPill=st=>`<span class="pill ${DOC_PILL[st.s][0]} nodot">${st.s==="bientot"?st.d+" j":st.s==="expire"?"Expirée depuis "+(-st.d)+" j":DOC_PILL[st.s][1]}</span>`;
const expiredDocs=c=>DOCS.filter(([k])=>docSt(c,k).s==="expire").map(x=>x[1]);
const pill=(m,k)=>m[k]?`<span class="pill ${m[k].c}">${m[k].l}</span>`:"";

const state={camions:[],missions:[],depenses:[],gestionnaires:[]};
let store=null, mode="loading", canWrite=true;
let isOwner=false, gLoaded=false, pickG=null, lockSig="";
let lastErr=null, slowLoad=false, fdb=null, auth=null, authUser=null, adminUid=null, adminEmail=null, pendingCode=null, setupBusy=false, dataUnsubs=[];
const DOMAIN="socobema-flotte.app";
const ACCESS_URL=location.origin+location.pathname;
const sync={cache:{},pending:{},error:false,offline:!navigator.onLine};
let filters={camType:"tous",mSt:"actives",dCam:"tous"};

/* ---------- Données dérivées ---------- */
const alive=c=>state[c].filter(x=>!x.supprime);
const trashed=c=>state[c].filter(x=>x.supprime);
const camById=id=>state.camions.find(c=>c.id===id);
const activeMission=(camId,exceptId)=>alive("missions").find(m=>m.camionId===camId&&m.statut==="en_cours"&&m.id!==exceptId);
const effStatut=c=>activeMission(c.id)?"mission":(MANUAL.includes(c.statut)?c.statut:"disponible");
const plateOf=id=>{const c=camById(id);return c?`<span class="plate">${esc(c.immat)}</span>${c.supprime?' <span class="pill p-mut nodot">à la corbeille</span>':""}`:`<span class="pill p-mut nodot">Camion inconnu</span>`};
const byDateDesc=(a,b)=>(b.date||"").localeCompare(a.date||"")||(b.majLe||"").localeCompare(a.majLe||"");
const who=id=>{if(!id)return"";const g=state.gestionnaires.find(x=>x.id===id);return g?(g.role==="pca"?"PCA":g.nom):""};
const auteur=x=>x.gest?x.gest:who(x.majPar);
const trace=x=>x.majLe?`<div class="trace">Modifié le ${fdt(x.majLe)}${auteur(x)?" par "+esc(auteur(x)):""}</div>`:"";
const pcaDoc=()=>state.gestionnaires.find(g=>g.id===adminUid);
const activeG=()=>state.gestionnaires.filter(g=>g.actif!==false&&g.role!=="pca"&&!g.remplace);
const pool=()=>[pcaDoc(),...activeG().sort((a,b)=>(a.nom||"").localeCompare(b.nom||""))].filter(Boolean);
const curG=()=>authUser&&state.gestionnaires.find(g=>g.id===authUser.uid&&g.actif!==false&&!g.remplace);
const isLocked=()=>mode!=="db"||!curG();

/* ---------- Stockage (Firebase) ---------- */
const stamp=()=>{const g=curG();return{majLe:new Date().toISOString(),majPar:authUser?authUser.uid:null,gest:isOwner?"PCA":(g?g.nom:null)}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fsName=c=>c==="gestionnaires"?"comptes":c;
/* Hors connexion, Firestore garde l'écriture et l'envoie au retour du réseau : on n'attend donc pas le serveur indéfiniment. */
function queued(p){p.catch(e=>toast(errMsg(e)));return Promise.race([p,sleep(1500)])}
function errMsg(e){
  const c=(e&&e.code)||"";
  if(c==="permission-denied") return "Accès refusé : votre code n'est peut-être plus valide. Reconnectez-vous.";
  if(c==="resource-exhausted") return "Limite gratuite du jour atteinte. Réessayez demain ou passez à l'offre payante Firebase.";
  if(c==="auth/requires-recent-login") return "Par sécurité, verrouillez, reconnectez-vous avec votre code actuel, puis réessayez.";
  if(c==="auth/network-request-failed"||c==="unavailable") return "Pas de connexion internet. Réessayez quand le réseau revient.";
  if(c==="auth/weak-password") return "Code refusé : il doit contenir 6 chiffres.";
  if(/api-key|invalid-api|app-not-authorized/.test(c)) return "Configuration Firebase incorrecte (clé API). Prévenez l'administrateur.";
  if(c==="auth/operation-not-allowed") return "La connexion par e-mail/mot de passe n'est pas activée dans Firebase (étape 2).";
  return "L'enregistrement n'a pas abouti. Vos saisies sont gardées : réessayez.";
}
async function newAuthUser(code){
  const app=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(window.FIREBASE_CONFIG,"sec");
  const a=app.auth(); const email=`g-${newSalt()}@${DOMAIN}`;
  const cred=await a.createUserWithEmailAndPassword(email,code); await a.signOut();
  return{uid:cred.user.uid,email};
}
async function createCompte(o){
  const code=pendingCode; pendingCode=null; if(!code) throw {code:"x"};
  const u=await newAuthUser(code);
  const b=fdb.batch();
  b.set(fdb.collection("comptes").doc(u.uid),{nom:o.nom,tel:o.tel||"",role:"gestionnaire",actif:true,email:u.email,codeLe:new Date().toISOString(),...stamp()});
  b.set(jRef(),jEntry("ajout","gestionnaires",u.uid,o.nom));
  await b.commit();
}
async function renewCode(id,code){
  const g=state.gestionnaires.find(x=>x.id===id); if(!g) return;
  const now=new Date().toISOString();
  if(g.id===adminUid){await auth.currentUser.updatePassword(code);await fdb.collection("comptes").doc(id).update({codeLe:now,...stamp()});return}
  const u=await newAuthUser(code);
  const b=fdb.batch();
  b.set(fdb.collection("comptes").doc(u.uid),{nom:g.nom,tel:g.tel||"",role:"gestionnaire",actif:true,email:u.email,codeLe:now,...stamp()});
  b.update(fdb.collection("comptes").doc(id),{actif:false,remplace:true,remplacePar:u.uid,...stamp()});
  b.set(jRef(),jEntry("nouveau code","gestionnaires",u.uid,g.nom));
  await b.commit();
}
/* Chaque écriture est accompagnée, dans le même lot, d'une ligne d'historique non modifiable (avec l'état d'avant). */
const clean=x=>{if(!x)return null;const r={...x};delete r.id;return r};
function resumeOf(c,x){if(!x)return"";return c==="camions"?(x.immat||""):c==="missions"?`${x.origine||"?"} → ${x.destination||"?"} (${x.date||""})`:c==="depenses"?`${x.categorie||""} ${x.montant||0} FCFA (${x.date||""})`:(x.nom||"")}
function jEntry(action,c,id,resume,avant){return{le:new Date().toISOString(),par:authUser.uid,nom:isOwner?"PCA":((curG()||{}).nom||""),action,coll:c,docId:id,resume:String(resume||"").slice(0,200),avant:avant||null}}
const jRef=()=>fdb.collection("journal").doc();
function dataStore(){
  return{
    add:async(c,o)=>{
      if(c==="gestionnaires"){await createCompte(o);return}
      const ref=fdb.collection(c).doc(), data={...o,...stamp(),creeLe:new Date().toISOString(),creePar:authUser.uid};
      const b=fdb.batch(); b.set(ref,data); b.set(jRef(),jEntry("ajout",c,ref.id,resumeOf(c,data)));
      return queued(b.commit());
    },
    update:async(c,id,o)=>{
      if(c==="gestionnaires"&&pendingCode&&o.codeLe){const code=pendingCode;pendingCode=null;await renewCode(id,code);return}
      const fc=fsName(c), before=clean(state[c].find(x=>x.id===id));
      const action=o.supprime===true?"corbeille":o.supprime===false?"restauration":c==="gestionnaires"&&"actif" in o?(o.actif?"réactivation":"désactivation"):"modification";
      const b=fdb.batch(); b.update(fdb.collection(fc).doc(id),{...o,...stamp()}); b.set(jRef(),jEntry(action,c,id,resumeOf(c,{...before,...o}),c==="gestionnaires"?null:before));
      return c==="gestionnaires"?b.commit():queued(b.commit());
    },
    destroy:async(c,id)=>{
      const before=clean(state[c].find(x=>x.id===id));
      const b=fdb.batch(); b.delete(fdb.collection(fsName(c)).doc(id)); b.set(jRef(),jEntry("suppression définitive",c,id,resumeOf(c,before),before));
      return queued(b.commit());
    },
    revert:async(c,id,avant)=>{
      const b=fdb.batch(); b.set(fdb.collection(c).doc(id),{...avant,...stamp()}); b.set(jRef(),jEntry("rétablissement",c,id,resumeOf(c,avant),clean(state[c].find(x=>x.id===id))));
      return queued(b.commit());
    }
  };
}
function subscribeData(){
  dataUnsubs.forEach(u=>u()); dataUnsubs=[];
  if(!authUser){state.camions=[];state.missions=[];state.depenses=[];return}
  for(const c of ["camions","missions","depenses"]){
    sync.cache[c]=true;
    dataUnsubs.push(fdb.collection(c).onSnapshot({includeMetadataChanges:true},snap=>{
      state[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      sync.cache[c]=snap.metadata.fromCache; sync.pending[c]=snap.metadata.hasPendingWrites; sync.error=false;
      render();
    },e=>{
      if(e&&e.code==="permission-denied"){if(authUser) auth.signOut(); return}
      sync.error=true; showSync();
    }));
  }
}
async function act(p,ok){try{await p;if(ok)toast(ok);return true}catch(e){toast(errMsg(e));return false}}
function showBanner(kind,html){const b=$("#banner");b.className="banner "+kind;b.innerHTML=html;b.hidden=false}
function showSync(){
  const el=$("#sync"); let k="ok",t="À jour";
  if(sync.offline){k="bad";t="Hors connexion · enregistré sur le téléphone"}
  else if(sync.error){k="bad";t="Connexion interrompue"}
  else if(Object.values(sync.pending).some(Boolean)){k="busy";t="Envoi en cours…"}
  else if(mode==="loading"||Object.values(sync.cache).some(Boolean)){k="busy";t="Synchronisation…"}
  el.className="sync "+k; el.textContent=t;
}
addEventListener("online",()=>{sync.offline=false;showSync()});
addEventListener("offline",()=>{sync.offline=true;showSync()});

/* Verrouillage automatique après inactivité (seulement avec réseau : hors connexion, on ne pourrait pas se reconnecter). */
const IDLE_MIN=30; let lastAct=Date.now();
try{const v=+localStorage.getItem("flotte-act"); if(v) lastAct=v}catch(e){}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();try{localStorage.setItem("flotte-act",String(lastAct))}catch(e){}},{passive:true}));
setInterval(()=>{if(authUser&&navigator.onLine&&Date.now()-lastAct>IDLE_MIN*6e4){auth.signOut();toast("Verrouillé après 30 minutes sans activité.")}},30000);
let backupAt=undefined, backupUnsub=null;
function watchBackup(){
  if(backupUnsub){backupUnsub();backupUnsub=null}
  backupAt=undefined; if(!authUser) return;
  backupUnsub=fdb.doc("config/sauvegarde").onSnapshot(s=>{backupAt=s.exists?s.data().lastAt:null;render()},()=>{});
}
function backupBanner(){
  const b=$("#banner"); if(!isOwner||backupAt===undefined||alive("camions").length===0){if(b.dataset.k==="bk"){b.hidden=true;b.dataset.k=""}return}
  const d=backupAt?Math.floor((Date.now()-new Date(backupAt))/864e5):null;
  if(d!==null&&d<7){if(b.dataset.k==="bk"){b.hidden=true;b.dataset.k=""}return}
  showBanner("warn",`${d===null?"Aucune sauvegarde complète n'a encore été faite.":"Dernière sauvegarde complète il y a "+d+" jours."} <button class="btn sm" type="button" data-backup>Sauvegarder maintenant</button>`); b.dataset.k="bk";
}
async function fullBackup(){
  const data={app:"flotte-socobema",version:1,date:new Date().toISOString(),camions:state.camions.map(clean2),missions:state.missions.map(clean2),depenses:state.depenses.map(clean2)};
  saveBlob(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),`sauvegarde-flotte-socobema_${today()}.json`);
  if(isOwner) try{await fdb.doc("config/sauvegarde").set({lastAt:new Date().toISOString(),par:authUser.uid,majPar:authUser.uid})}catch(e){}
  toast("Sauvegarde téléchargée. Gardez ce fichier en lieu sûr (clé USB, Google Drive).");
}
const clean2=x=>({...x});
async function restoreBackup(file){
  let data; try{data=JSON.parse(await file.text())}catch(e){toast("Fichier illisible : ce n'est pas une sauvegarde de la flotte.");return}
  if(!data||data.app!=="flotte-socobema"){toast("Ce fichier n'est pas une sauvegarde de la flotte SOCOBEMA.");return}
  const n=["camions","missions","depenses"].reduce((t,c)=>t+((data[c]||[]).length),0);
  openConfirm("Restaurer une sauvegarde",`Sauvegarde du <b>${fdt(data.date)}</b> : ${n} fiches. Les fiches de la sauvegarde remplaceront celles qui portent le même identifiant. Les fiches créées depuis restent en place.`,"Restaurer",async()=>{
    const ops=[];["camions","missions","depenses"].forEach(c=>(data[c]||[]).forEach(x=>{if(x&&x.id){const r={...x};delete r.id;ops.push([c,x.id,r])}}));
    for(let i=0;i<ops.length;i+=400){const b=fdb.batch();ops.slice(i,i+400).forEach(([c,id,r])=>b.set(fdb.collection(c).doc(id),{...r,...stamp()}));if(i===0)b.set(jRef(),jEntry("restauration de sauvegarde","sauvegarde","-",`${n} fiches du ${data.date.slice(0,10)}`));await b.commit()}
    toast(`${n} fiches restaurées`);
  },false);
}
async function openJournal(){
  $("#dlg-t").textContent="Historique des modifications";
  $("#dlg-b").innerHTML=`<div class="msgs" id="dlg-msgs"></div><div class="tool"><p style="margin:0;color:var(--muted)">Chargement…</p></div>`;
  $("#dlg-f").innerHTML=`<button type="button" class="btn" data-tools>Retour</button><button type="button" class="btn" data-close>Fermer</button>`;
  ctx={kind:"journal"}; if(!$("#dlg").open) $("#dlg").showModal();
  try{
    const snap=await fdb.collection("journal").orderBy("le","desc").limit(80).get();
    journalCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    const CL={camions:"Camion",missions:"Mission",depenses:"Dépense",gestionnaires:"Gestionnaire",sauvegarde:"Sauvegarde"};
    $("#dlg-b").innerHTML=`<div class="msgs" id="dlg-msgs"></div><div class="tool"><p style="margin:0;font-size:.85rem;color:var(--muted)">Les 80 dernières actions. Cet historique ne peut être ni modifié ni effacé, même par vous.</p>
      ${journalCache.map(j=>`<div class="item"><div><b>${esc(CL[j.coll]||j.coll)}</b> · ${esc(j.action)} · ${esc(j.resume)}<div class="trace">${fdt(j.le)} par ${esc(j.nom||"?")}</div></div>${j.avant&&["camions","missions","depenses"].includes(j.coll)?`<button type="button" class="btn sm" data-revert="${j.id}">Rétablir l'état d'avant</button>`:""}</div>`).join("")||`<p style="margin:0">Aucune action enregistrée.</p>`}</div>`;
  }catch(e){$("#dlg-b").innerHTML=`<div class="msgs" id="dlg-msgs"></div><p class="confirm">Impossible de charger l'historique. ${esc(errMsg(e))}</p>`}
}
let journalCache=[];

addEventListener("error",e=>{lastErr={code:(e.message||"erreur script")};if(mode==="loading"){lockSig="";slowLoad=true;render()}});
addEventListener("unhandledrejection",e=>{const r=e.reason||{};lastErr={code:r.code||r.message||String(r)};if(mode==="loading"){lockSig="";slowLoad=true;render()}});
async function init(){
  setTimeout(()=>{if(mode==="loading"){lockSig="";slowLoad=true;render()}},12000);
  render();
  const C=window.FIREBASE_CONFIG;
  if(!window.firebase||!C||!C.apiKey||/COLLER/.test(C.apiKey)){mode="nocfg";render();return}
  try{
    firebase.initializeApp(C); fdb=firebase.firestore(); auth=firebase.auth();
    try{fdb.settings({experimentalForceLongPolling:true,merge:true})}catch(e){console.warn(e)}
    /* Pas de stockage hors ligne au démarrage : certains navigateurs intégrés (WebView) le bloquent indéfiniment. */
  }catch(e){mode="nocfg";render();return}
  store=dataStore();
  let cfgLoaded=false, cLoaded=false;
  const update=()=>{
    if(cfgLoaded&&cLoaded){gLoaded=true;mode=adminUid?"db":"setup"}
    isOwner=!!(authUser&&adminUid&&authUser.uid===adminUid);
    if(authUser&&gLoaded&&mode==="db"&&!setupBusy&&!curG()){auth.signOut();toast("Ce code n'est plus valide. Demandez un nouveau code au PCA.")}
    render();
  };
  const applyAdmin=s=>{adminUid=s.exists?s.data().uid:null; adminEmail=s.exists?s.data().email:null; cfgLoaded=true; update()};
  (async()=>{for(let i=0;i<8&&!cfgLoaded;i++){try{applyAdmin(await fdb.doc("config/admin").get({source:"server"}));return}catch(e){lastErr=e;await sleep(2500)}}})();
  fdb.doc("config/admin").onSnapshot({includeMetadataChanges:true},s=>{
    if(s.metadata.fromCache&&!s.exists) return;
    adminUid=s.exists?s.data().uid:null; adminEmail=s.exists?s.data().email:null; cfgLoaded=true; update();
  },e=>{console.error(e);showBanner("bad","Impossible de lire la configuration ("+esc((e&&e.code)||"erreur")+"). Vérifiez les règles Firestore (étape 4 du guide).")});
  fdb.collection("comptes").onSnapshot(s=>{state.gestionnaires=s.docs.map(d=>({id:d.id,...d.data()}));cLoaded=true;update()},
    ()=>{showBanner("bad","Impossible de lire la liste des gestionnaires. Vérifiez les règles Firestore (étape 4 du guide).")});
  auth.onAuthStateChanged(u=>{
    if(u&&navigator.onLine&&Date.now()-lastAct>IDLE_MIN*6e4){auth.signOut();return}
    const changed=(u&&u.uid)!==(authUser&&authUser.uid);authUser=u;if(changed){subscribeData();watchBackup()}update()});
}

/* ---------- Rendu ---------- */
function render(){
  const L=isLocked();
  document.body.classList.toggle("locked",L);
  if(L) renderLock(); else lockSig="";
  const g=curG();
  $("#who").textContent=!g?"":isOwner?"PCA (propriétaire)":"Gestionnaire : "+g.nom;
  $("#btn-lock").hidden=!g; $("#btn-lock").textContent=isOwner?"Verrouiller":"Changer";
  renderTableau(); renderCamions(); renderMissions(); renderDocuments(); renderDepenses(); showSync(); backupBanner();
  const nPb=alive("camions").reduce((n,c)=>n+DOCS.filter(([k])=>{const s=docSt(c,k).s;return s==="expire"||s==="bientot"}).length,0);
  $("#doc-n").innerHTML=nPb?`<span class="badge">${nPb}</span>`:"";
  const n=trashed("camions").length+trashed("missions").length+trashed("depenses").length;
  $("#trash-n").innerHTML=n?`<span class="badge" aria-label="${n} élément(s) dans la corbeille">${n}</span>`:"";
}

function newCode(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%900000+100000)}
function newSalt(){const a=new Uint8Array(6);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function codeFields(code){pendingCode=code;return{codeLe:new Date().toISOString()}}

    <p class="lock-err" id="lock-err" role="alert"></p>
    <button class="lk-btn" type="submit" id="lock-ok">Créer l'accès propriétaire</button></form>`;return}

      <select id="lk-who" class="lk-in">${G.length!==1?`<option value="">Choisir votre nom…</option>`:""}${G.map(g=>`<option value="${g.id}"${pickG===g.id?" selected":""}>${esc(lab(g))}</option>`).join("")}</select></div>

document.addEventListener("click",async e=>{

document.addEventListener("submit",async e=>{
  if(e.target.id==="setup-form"){
    e.preventDefault(); const err=$("#lock-err"), ok=$("#lock-ok");
    const mail=$("#su-mail").value.trim(), p1=$("#su-pin").value.trim(), p2=$("#su-pin2").value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){err.textContent="Adresse e-mail invalide.";return}
    if(!/^\d{6}$/.test(p1)){err.textContent="Le code doit contenir exactement 6 chiffres.";return}
    if(p1!==p2){err.textContent="Les deux codes ne sont pas identiques.";return}
    ok.disabled=true; ok.textContent="Création…"; setupBusy=true;
    try{
      const cred=await auth.createUserWithEmailAndPassword(mail,p1);
      const now=new Date().toISOString(), uid=cred.user.uid;
      const b=fdb.batch();
      b.set(fdb.collection("comptes").doc(uid),{nom:"PCA",role:"pca",actif:true,email:mail,codeLe:now,majLe:now,majPar:uid,gest:"PCA"});
      b.set(fdb.doc("config/admin"),{uid,email:mail,creeLe:now});
      await b.commit(); setupBusy=false; toast("Accès propriétaire créé");
    }catch(x){
      setupBusy=false; ok.disabled=false; ok.textContent="Créer l'accès propriétaire";
      err.textContent=x&&x.code==="auth/email-already-in-use"?"Cette adresse a déjà un accès. Utilisez une autre adresse Gmail.":x&&x.code==="permission-denied"?"Refusé : un propriétaire existe déjà, ou les règles Firestore ne sont pas publiées.":errMsg(x);
      if(auth.currentUser&&!adminUid) try{await auth.currentUser.delete()}catch(_){}
    }
    return;
  }
  if(e.target.id!=="lock-form") return; e.preventDefault();
  const errEl=$("#lock-err"), pin=$("#pin"), ok=$("#lock-ok");
  if(!pickG){errEl.textContent="Choisissez d'abord votre nom dans la liste.";return}
  const code=pin.value.replace(/\D/g,"");
  if(code.length!==6){errEl.textContent="Le code doit contenir 6 chiffres.";return}
  const g=pool().find(x=>x.id===pickG); if(!g) return;
  ok.disabled=true; ok.textContent="Vérification…";
  try{
    await auth.signInWithEmailAndPassword(g.email,code);
    toast("Bienvenue, "+(g.id===adminUid?"Monsieur le PCA":g.nom));
  }catch(x){
    const c=x&&x.code||"";
    errEl.textContent=/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c)?"Code incorrect.":c==="auth/too-many-requests"?"Trop d'essais. Attendez quelques minutes avant de réessayer.":c==="auth/user-disabled"?"Cet accès a été désactivé.":errMsg(x);
    pin.value=""; pin.focus();
  }finally{ok.disabled=false;ok.textContent="Ouvrir"}
});

      else if(st.s==="bientot") alerts.push({o:st.d,h:`<span class="pill p-warn nodot">${st.d} j</span><div><span class="plate">${esc(c.immat)}</span> ${l} expire le ${fdate(c[k])}</div>`});
    });
    if(c.statut==="panne") alerts.push({o:-999,h:`<span class="pill p-bad nodot">Panne</span><div><span class="plate">${esc(c.immat)}</span> immobilisé${c.chauffeur?" · chauffeur "+esc(c.chauffeur):""}</div>`});

  M.filter(m=>m.statut==="en_cours"&&daysTo(m.date)!==null&&daysTo(m.date)<-3).forEach(m=>{

const NUMS=["capaciteT","km","sacs","poidsKg","fraisRoute","montant","litres"];
const LABEL={};for(const c in FORMS) FORMS[c].fields({}).forEach(f=>LABEL[f.k]=f.l);

function validate(coll,o,id,ctx){
  const E=[],W=[],bad=new Set();
  const err=(k,m)=>{E.push(m);if(k)bad.add(k)}, warn=m=>W.push(m);
  FORMS[coll].fields({}).forEach(f=>{if(f.req&&(o[f.k]===""||o[f.k]==null)) err(f.k,`« ${f.l} » est obligatoire.`)});
  NUMS.forEach(k=>{if(k in o&&o[k]!=null){if(!isFinite(o[k])) err(k,`« ${LABEL[k]} » n'est pas un nombre valide.`);else if(o[k]<0) err(k,`« ${LABEL[k]} » ne peut pas être négatif.`)}});
  const t=today();
  if(coll==="camions"){
    if(o.immat&&plateKey(o.immat).length<4) err("immat","L'immatriculation semble incomplète.");
    const dup=alive("camions").find(c=>c.id!==id&&plateKey(c.immat)===plateKey(o.immat));
    if(o.immat&&dup) err("immat",`Le camion ${dup.immat} existe déjà.`);
    if(o.capaciteT!=null&&(o.capaciteT===0||o.capaciteT>60)) err("capaciteT","La capacité doit être comprise entre 0,5 et 60 tonnes.");
    const prev=id&&camById(id);
    if(prev&&prev.km&&o.km!=null&&o.km<prev.km) warn(`Le compteur baisse : ${nb(prev.km)} km → ${nb(o.km)} km. Est-ce une correction ?`);
    const yr=new Date().getFullYear();
    DOCS.forEach(([k,l])=>{if(o[k]){const y=+o[k].slice(0,4); if(y<yr-5||y>yr+6) err(k,`Date de fin « ${l} » invraisemblable (${fdate(o[k])}).`)}});
    if(prev&&activeMission(id)&&o.statut!=="disponible") warn("Ce camion a une mission en cours. Pensez à la terminer ou l'annuler.");
    if(o.telChauffeur&&o.telChauffeur.replace(/\D/g,"").length<8) warn("Le numéro du chauffeur semble incomplet.");
  }
  if(coll==="missions"){
    const c=camById(o.camionId);
    if(o.camionId&&!c) err("camionId","Ce camion n'existe plus.");
    if(o.origine&&o.destination&&o.origine.trim().toLowerCase()===o.destination.trim().toLowerCase()) err("destination","Le départ et l'arrivée sont identiques.");
    if(c&&o.statut==="en_cours"){
      if(c.statut==="panne"||c.statut==="maintenance") err("statut",`Le camion ${c.immat} est ${CST[c.statut].l.toLowerCase()} : il ne peut pas partir en mission.`);
      const other=activeMission(c.id,id); if(other) err("statut",`Le camion ${c.immat} est déjà en mission (${other.origine} → ${other.destination}).`);
    }
    if(c&&c.supprime) err("camionId","Ce camion est à la corbeille.");
    if(c&&(o.statut==="en_cours"||o.statut==="planifiee")){const ex=expiredDocs(c); if(ex.length) warn(`Documents expirés pour ${c.immat} : ${ex.join(", ")}. Risque d'amende ou d'immobilisation.`)}
    if(c&&c.capaciteT&&o.poidsKg>c.capaciteT*1000) warn(`Surcharge : ${nb(o.poidsKg/1000)} t pour une capacité de ${nb(c.capaciteT)} t.`);
    if(o.sacs&&o.poidsKg){const kg=o.poidsKg/o.sacs; if(kg<20||kg>110) warn(`Poids moyen inhabituel : ${nb(kg)} kg par sac.`)}
    if(o.statut==="livree"&&o.date>t) warn("Mission marquée livrée avec une date future.");
    if(o.date&&daysTo(o.date)<-365) warn("La date a plus d'un an.");
    if(o.bordereau){const dup=alive("missions").find(m=>m.id!==id&&m.bordereau&&m.bordereau.trim().toLowerCase()===o.bordereau.trim().toLowerCase()); if(dup) err("bordereau",`Le bordereau ${o.bordereau} est déjà utilisé (mission du ${fdate(dup.date)}).`)}
    if(o.statut==="livree"&&!o.poidsKg&&!o.sacs) warn("Mission livrée sans poids ni nombre de sacs : le tonnage du mois sera faux.");
  }
  if(coll==="depenses"){
    if(o.montant===0) err("montant","Le montant doit être supérieur à zéro.");
    if(o.montant>5000000) warn(`Montant élevé : ${fcfa(o.montant)}. Vérifiez le nombre de zéros.`);
    if(o.date>t) warn("La date de la dépense est dans le futur.");
    if(o.categorie==="Carburant"&&o.litres&&o.montant){const pl=o.montant/o.litres; if(pl<500||pl>1100) warn(`Prix au litre inhabituel : ${fcfa(pl)}/L.`)}
    if(o.litres&&o.categorie!=="Carburant") warn("Des litres sont saisis pour une dépense qui n'est pas du carburant.");
    const dup=alive("depenses").find(d=>d.id!==id&&d.camionId===o.camionId&&d.date===o.date&&d.categorie===o.categorie&&+d.montant===+o.montant);
    if(dup) warn("Une dépense identique existe déjà (même camion, date, catégorie et montant). Doublon ?");
  }
  if(coll==="gestionnaires"&&o.nom){
    const dup=state.gestionnaires.find(g=>g.id!==id&&!g.remplace&&g.nom.trim().toLowerCase()===o.nom.trim().toLowerCase());
    if(dup) err("nom",`Un gestionnaire s'appelle déjà « ${dup.nom} ».`);
  }
  if(id&&ctx){const now=(state[coll].find(x=>x.id===id)||{}).majLe; if(now&&now!==ctx.openedMaj){const p=(state[coll].find(x=>x.id===id)||{}).majPar; warn(`Cette fiche a été modifiée${p?" par "+who(p):""} pendant que vous l'éditiez. Enregistrer remplacera ses changements.`)}}
  return{E,W,bad};
}

let ctx=null;

function readForm(coll){
  const o={},fd=new FormData($("#frm"));
  for(const [k,v] of fd.entries()){const s=String(v).trim(); o[k]=NUMS.includes(k)?(s===""?null:Number(s.replace(",",".").replace(/\s/g,""))):s}
  if(o.immat) o.immat=normPlate(o.immat);
  return o;

function openConfirm(title,msg,label,fn,danger=true){
  $("#dlg-t").textContent=title;
  $("#dlg-b").innerHTML=`<div class="msgs" id="dlg-msgs"></div><p class="confirm">${msg}</p>`;
  $("#dlg-f").innerHTML=`<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn ${danger?"danger":"primary"}" id="dlg-ok">${label}</button>`;
  ctx={kind:"confirm",fn,saving:false,label};
  if(!$("#dlg").open) $("#dlg").showModal();
}

$("#frm").addEventListener("input",()=>{if(ctx&&ctx.kind==="form"&&ctx.confirmed){ctx.confirmed=false;const b=$("#dlg-ok");b.className="btn primary";b.textContent=ctx.label;setMsgs([],[])}});
$("#frm").addEventListener("submit",async e=>{
  e.preventDefault(); if(!ctx||ctx.saving) return;
  const ok=$("#dlg-ok");
  if(ctx.kind==="form"){
    const o=readForm(ctx.coll);
    const {E,W,bad}=validate(ctx.coll,o,ctx.id,ctx);
    document.querySelectorAll("#dlg-b [name]").forEach(el=>el.setAttribute("aria-invalid",bad.has(el.name)?"true":"false"));
    if(E.length){setMsgs(E,W);return}
    if(W.length&&!ctx.confirmed){ctx.confirmed=true;setMsgs([],W);ok.className="btn warnb";ok.textContent="Enregistrer quand même";return}
    ctx.saving=true; ok.disabled=true; ok.textContent="Enregistrement…";
    try{
      let code=null;
      if(ctx.coll==="gestionnaires"&&!ctx.id){code=newCode();Object.assign(o,await codeFields(code),{actif:true})}
      if(ctx.id) await store.update(ctx.coll,ctx.id,o); else await store.add(ctx.coll,o);
      const L=COLL_L[ctx.coll];
      if(code){showCode(o.nom,code);return}
      $("#dlg").close(); toast(ctx.id?"Modifications enregistrées":L[0].toUpperCase()+L.slice(1)+(MASC[ctx.coll]?" ajouté":" ajoutée"));
    }catch(err){setMsgs([errMsg(err)],[]);ctx.saving=false;ok.disabled=false;ok.textContent="Réessayer"}
  } else if(ctx.kind==="confirm"){
    ctx.saving=true; ok.disabled=true; ok.textContent="Patientez…";
    try{const r=await ctx.fn(); if(r!==false&&$("#dlg").open&&ctx.kind==="confirm") $("#dlg").close()}
    catch(err){setMsgs([errMsg(err)],[]);ctx.saving=false;ok.disabled=false;ok.textContent="Réessayer"}
  }
});
$("#dlg").addEventListener("click",e=>{if(e.target.closest("[data-close]")) $("#dlg").close()});
$("#dlg").addEventListener("cancel",e=>{if(ctx&&ctx.saving) e.preventDefault()});

/* ---------- Corbeille et sauvegarde ---------- */
function softDelete(coll,id){
  const x=state[coll].find(v=>v.id===id); if(!x) return;
  if(coll==="camions"&&activeMission(id)){toast("Ce camion a une mission en cours. Terminez-la ou annulez-la d'abord.");return}
  const label=coll==="camions"?`le camion <span class="plate">${esc(x.immat)}</span>`:coll==="missions"?`la mission ${esc(x.origine)} → ${esc(x.destination)} du ${fdate(x.date)}`:`la dépense de ${fcfa(x.montant)} du ${fdate(x.date)}`;
  openConfirm("Mettre à la corbeille",`Mettre ${label} à la corbeille ? Vous pourrez le restaurer depuis Outils → Corbeille.`,"Mettre à la corbeille",async()=>{
    await store.update(coll,id,{supprime:true,supprimeLe:new Date().toISOString()}); toast("Mis à la corbeille");
  });
}
async function restore(coll,id){
  const x=state[coll].find(v=>v.id===id); if(!x) return;
  const patch={supprime:false};
  if(coll==="camions"){const dup=alive("camions").find(c=>plateKey(c.immat)===plateKey(x.immat)); if(dup){toast(`Impossible : un camion ${dup.immat} existe déjà.`);return}}
  if(coll==="missions"&&x.statut==="en_cours"){
    const c=camById(x.camionId);
    if(!c||c.supprime||activeMission(x.camionId)||c.statut!=="disponible"){patch.statut="planifiee"}
  }
  if(await act(store.update(coll,id,patch),patch.statut?"Restaurée en « Planifiée » (camion occupé)":"Restauré")) openTools();
}
function csv(rows,cols){
  const q=v=>{v=v==null?"":String(v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return "﻿"+[cols.map(c=>q(c[1])).join(";"),...rows.map(r=>cols.map(c=>q(typeof c[0]==="function"?c[0](r):r[c[0]])).join(";"))].join("\r\n");
}

      <p style="margin:0;font-size:.85rem;color:var(--muted)">Sauvegarde complète à garder sur une clé USB ou Google Drive, au moins une fois par semaine.${backupAt?" Dernière : "+fdt(backupAt)+".":""}</p>
      <div class="row"><button type="button" class="btn sm primary" data-backup>Sauvegarde complète</button><label class="btn sm" for="restore-file" style="display:inline-flex;align-items:center">Restaurer une sauvegarde</label><input type="file" id="restore-file" accept="application/json,.json" hidden><button type="button" class="btn sm" data-journal>Historique des modifications</button></div></div>`:""}
    <div class="tool"><h3 style="margin:0">Exports Excel (CSV)</h3>
      <p style="margin:0;font-size:.85rem;color:var(--muted)">Pour travailler les chiffres dans Excel.</p>
      <div class="row"><button type="button" class="btn sm" data-exp="camions">Camions</button><button type="button" class="btn sm" data-exp="missions">Missions</button><button type="button" class="btn sm" data-exp="depenses">Dépenses</button></div>
      <div id="csv-box" class="tool" hidden></div></div>
    <div class="tool"><h3 style="margin:8px 0 0">Corbeille (${items.length})</h3>
      ${items.length?items.map(i=>`<div class="item"><div>${lab(i)}<div class="trace">Supprimé le ${fdt(i.x.supprimeLe)}${i.x.majPar?" par "+esc(who(i.x.majPar)):""}</div></div><div class="row w"><button type="button" class="btn sm" data-res="${i.c}" data-id="${i.x.id}">Restaurer</button>${isOwner?`<button type="button" class="btn sm ghost" data-purge="${i.c}" data-id="${i.x.id}">Supprimer définitivement</button>`:""}</div></div>`).join(""):`<p style="margin:0;font-size:.88rem;color:var(--muted)">La corbeille est vide.</p>`}
    </div>`;
  $("#dlg-f").innerHTML=`<button type="button" class="btn" data-close>Fermer</button>`;
  ctx={kind:"tools"};
  if(!$("#dlg").open) $("#dlg").showModal();
  const q=$("#qr");
  if(q){if(window.QRCode){try{new QRCode(q,{text:ACCESS_URL,width:320,height:320,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent="QR code indisponible"}}else q.textContent="QR code indisponible : utilisez le lien."}
}
function qrPoster(){
  const src=document.querySelector("#qr canvas"); if(!src) return null;
  const W=720,H=900,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
  x.fillStyle="#E2A410";x.fillRect(0,0,W,16);
  x.fillStyle="#17201C";x.textAlign="center";
  x.font="700 46px 'Barlow Condensed', Arial Narrow, Arial, sans-serif";x.fillText("FLOTTE SOCOBEMA",W/2,86);
  x.font="500 28px 'IBM Plex Sans', Arial, sans-serif";x.fillStyle="#5A6862";x.fillText("Accès des gestionnaires",W/2,130);
  x.imageSmoothingEnabled=false;x.drawImage(src,120,170,480,480);
  x.fillStyle="#17201C";x.font="500 26px 'IBM Plex Sans', Arial, sans-serif";
  x.fillText("1. Scannez le code   2. Choisissez votre nom",W/2,710);x.fillText("3. Entrez votre code à 6 chiffres",W/2,750);
  x.font="500 20px 'IBM Plex Mono', monospace";x.fillStyle="#5A6862";x.fillText(ACCESS_URL,W/2,820);
  x.font="400 18px 'IBM Plex Sans', Arial, sans-serif";x.fillText("SOCOBEMA · Mankono",W/2,860);
  return c;
}
$("#btn-tools").addEventListener("click",()=>{if(!store){toast("Chargement en cours, patientez un instant.");return}openTools()});
$("#dlg").addEventListener("click",e=>{
  const ex=e.target.closest("[data-exp]"); if(ex){exportColl(ex.dataset.exp);return}
  if(e.target.closest("[data-journal]")){openJournal();return}
  if(e.target.closest("[data-tools]")){openTools();return}
  const rv=e.target.closest("[data-revert]"); if(rv){const j=journalCache.find(x=>x.id===rv.dataset.revert); if(!j) return;
    openConfirm("Rétablir",`Remettre ${esc(j.resume)} dans l'état d'avant cette action (${fdt(j.le)}, par ${esc(j.nom)}) ?`,"Rétablir",async()=>{await store.revert(j.coll,j.docId,j.avant);toast("État d'avant rétabli");openJournal();return false},false);return}
  if(e.target.closest("[data-copylink]")){const t=$("#acc-link");
    (navigator.clipboard?navigator.clipboard.writeText(ACCESS_URL):Promise.reject()).then(()=>toast("Lien copié")).catch(()=>{t.focus();t.select();toast("Lien sélectionné : copiez-le avec le menu")});return}
  if(e.target.closest("[data-qrdl]")){
    const c=qrPoster(); if(!c){toast("QR code indisponible : envoyez plutôt le lien.");return}
    c.toBlob(b=>{try{saveBlob(b,"acces-flotte-socobema.png");toast("QR code téléchargé")}catch(err){toast("Téléchargement impossible : faites une capture d'écran.")}},"image/png");return}
  if(e.target.closest("[data-gadd]")){openForm("gestionnaires");return}
  const ge=e.target.closest("[data-gedit]"); if(ge){openForm("gestionnaires",ge.dataset.gedit);return}
  const gc=e.target.closest("[data-gcode]"); if(gc){const g=state.gestionnaires.find(x=>x.id===gc.dataset.gcode); if(!g) return;
    openConfirm("Nouveau code",`Générer un nouveau code pour <b>${esc(g.nom)}</b> ? L'ancien code ne fonctionnera plus.`,"Générer le code",async()=>{const code=newCode();await store.update("gestionnaires",g.id,await codeFields(code));showCode(g.nom,code);return false},false);return}
  const gt=e.target.closest("[data-gtoggle]"); if(gt){const g=state.gestionnaires.find(x=>x.id===gt.dataset.gtoggle); if(!g) return;
    const on=g.actif===false;
    openConfirm(on?"Réactiver":"Désactiver",on?`Réactiver l'accès de <b>${esc(g.nom)}</b> ?`:`Désactiver l'accès de <b>${esc(g.nom)}</b> ? Son code ne fonctionnera plus. Ses saisies restent dans l'historique.`,on?"Réactiver":"Désactiver",async()=>{await store.update("gestionnaires",g.id,{actif:on});toast(on?"Accès réactivé":"Accès désactivé");openTools();return false},!on);return}
  const cc=e.target.closest("#code-copy"); if(cc){const c=cc.dataset.code;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast("Code copié")).catch(()=>toast("Copie impossible : notez le code à la main"));return}
  const rs=e.target.closest("[data-res]"); if(rs){restore(rs.dataset.res,rs.dataset.id);return}
  const pg=e.target.closest("[data-purge]"); if(pg){const c=pg.dataset.purge,id=pg.dataset.id;
    openConfirm("Supprimer définitivement","Cet élément sera effacé pour toujours. Cette action ne peut pas être annulée.","Supprimer définitivement",async()=>{await store.destroy(c,id);toast("Supprimé définitivement");openTools();return false});return}
  if(e.target.id==="csv-copy"){const t=$("#csv-txt");
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast("Copié")).catch(()=>{t.focus();t.select();toast("Texte sélectionné : copiez-le avec le menu")});}
});

/* ---------- Actions ---------- */
document.addEventListener("change",e=>{if(e.target.id==="restore-file"&&e.target.files[0]){restoreBackup(e.target.files[0]);e.target.value=""}});
document.addEventListener("click",e=>{
  if(e.target.closest("[data-backup]")){fullBackup();return}
  if(e.target.closest("[data-reload]")){location.reload();return}
  const fb=e.target.closest("[data-f]");
  if(fb){filters[fb.dataset.f]=fb.dataset.val;render();return}
  const b=e.target.closest("[data-a]"); if(!b||b.closest("dialog")) return;
  if(!store){toast("Chargement en cours, patientez un instant.");return}
  if(!canWrite){toast("Lecture seule : vous ne pouvez pas modifier.");return}
  const id=b.dataset.id, a=b.dataset.a;
  if(a==="newCamion") openForm("camions");
  else if(a==="newMission"||a==="newDepense"){alive("camions").length?openForm(a==="newMission"?"missions":"depenses"):toast("Ajoutez d'abord un camion.")}
  else if(a==="edit") openForm(b.dataset.c,id);
  else if(a==="del") softDelete(b.dataset.c,id);
  else if(a==="startM"){
    const m=state.missions.find(x=>x.id===id), c=camById(m&&m.camionId);
    if(!c||c.supprime){toast("Le camion de cette mission n'existe plus.");return}
    if(c.statut==="panne"||c.statut==="maintenance"){toast(`${c.immat} est ${CST[c.statut].l.toLowerCase()} : impossible de démarrer.`);return}
    const o=activeMission(c.id,id); if(o){toast(`${c.immat} est déjà en mission (${o.origine} → ${o.destination}).`);return}
    const ex=expiredDocs(c);
    if(ex.length){openConfirm("Documents expirés",`<span class="plate">${esc(c.immat)}</span> a des documents expirés : <b>${esc(ex.join(", "))}</b>. Le camion risque une amende ou une immobilisation au contrôle.`,"Démarrer quand même",()=>store.update("missions",id,{statut:"en_cours"}).then(()=>toast("Mission démarrée")));return}
    b.disabled=true; act(store.update("missions",id,{statut:"en_cours"}),"Mission démarrée").finally(()=>b.disabled=false);
  }
  else if(a==="doneM"){
    const m=state.missions.find(x=>x.id===id);
    const go=()=>store.update("missions",id,{statut:"livree"}).then(()=>toast("Mission livrée"));
    if(m&&!m.poidsKg&&!m.sacs) openConfirm("Marquer livrée","Aucun poids ni nombre de sacs n'est saisi : le tonnage du mois sera faux. Vous pouvez d'abord modifier la mission.","Marquer livrée quand même",go,false);
    else{b.disabled=true;act(go()).finally(()=>b.disabled=false)}
  }
});
document.addEventListener("change",async e=>{
  if(e.target.dataset.camst){
    const sel=e.target, c=camById(sel.dataset.camst), prev=c?effStatut(c):"disponible";
    sel.disabled=true;
    const ok=await act(store.update("camions",sel.dataset.camst,{statut:sel.value}),"Statut mis à jour");
    if(!ok) sel.value=prev; sel.disabled=false;
  }
  if(e.target.id==="dCam"){filters.dCam=e.target.value;renderDepenses()}
});

/* ---------- Onglets ---------- */
const VIEWS=["tableau","camions","missions","documents","depenses"];
function show(v){
  if(!VIEWS.includes(v)) v="tableau";
  VIEWS.forEach(x=>{$("#v-"+x).hidden=x!==v;$("#t-"+x).setAttribute("aria-selected",x===v)});
  try{localStorage.setItem("flotte-tab",v)}catch(e){}
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{show(t.dataset.v);window.scrollTo(0,0)}));
let start=(location.hash||"").slice(1);
if(!VIEWS.includes(start)){try{start=localStorage.getItem("flotte-tab")||"tableau"}catch(e){start="tableau"}}
show(start);

let tt;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3200)}

init();
})();
</script>
</body>
</html>
