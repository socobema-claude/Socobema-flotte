<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234E8C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Comptabilité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : en-tête collant + sélecteur d'entreprise + onglets ; tableaux défilants sur téléphone. Ton : registre comptable sobre. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#E3E8E4; --ink:#17201C; --muted:#5A6862; --line:#D3DBD6;
  --accent:#234E8C; --accent-ink:#FFFFFF; --signal:#E2A410; --signal-ink:#1E1600;
  --ram:#234E8C; --ram-bg:#DCE7F3; --tra:#2B5B8C; --tra-bg:#DCE7F3;
  --ok:#1E7A45; --ok-bg:#DCF1E3; --warn:#8A5A00; --warn-bg:#FBEBC6; --bad:#B3261E; --bad-bg:#F8DEDB; --info:#2B5B8C; --info-bg:#DCE7F3;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E7EEEA; --muted:#97A59F; --line:#2E3A35;
  --accent:#8DB4F0; --accent-ink:#0A1A33; --signal:#F2B630; --signal-ink:#1E1600;
  --ram:#8DB4F0; --ram-bg:#3A2010; --tra:#7FAEE0; --tra-bg:#182A3D;
  --ok:#6CC79A; --ok-bg:#163126; --warn:#F2C25C; --warn-bg:#3A2C0D; --bad:#F08A80; --bad-bg:#3D1916; --info:#7FAEE0; --info-bg:#182A3D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211E; --sunk:#222C28; --ink:#E7EEEA; --muted:#97A59F; --line:#2E3A35;
  --accent:#8DB4F0; --accent-ink:#0A1A33; --signal:#F2B630; --signal-ink:#1E1600;
  --ram:#8DB4F0; --ram-bg:#3A2010; --tra:#7FAEE0; --tra-bg:#182A3D;
  --ok:#6CC79A; --ok-bg:#163126; --warn:#F2C25C; --warn-bg:#3A2C0D; --bad:#F08A80; --bad-bg:#3D1916; --info:#7FAEE0; --info-bg:#182A3D;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand svg{flex:none}
.brand .t{flex:1;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:1.55rem;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.sync{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok)}.sync.busy{color:var(--warn)}.sync.bad{color:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--f-disp);font-weight:600;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
main{padding-block:18px 60px}
.banner{border-radius:8px;padding:10px 12px;font-size:.86rem;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--info-bg);color:var(--info)}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warnb{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.82rem}
.btn.ghost{background:transparent}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font-size:.72rem;text-align:center;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.list{display:grid;gap:10px}
@media (min-width:760px){.list.cols{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;letter-spacing:.02em;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mut{background:var(--sunk);color:var(--muted)}
.pill.nodot::before{display:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.84rem}
.meta b{color:var(--ink);font-weight:500}
.trace{font-size:.74rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.empty .btn{margin-top:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.alert:first-child{border-top:0}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.86rem;margin-bottom:8px}
.track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--signal);border-radius:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
select.status{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:4px 6px}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,13,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.msgs{grid-column:1/-1;display:grid;gap:6px}
.msgs ul{margin:0;padding:10px 12px 10px 28px;border-radius:8px;font-size:.88rem}
.msgs ul.e{background:var(--bad-bg);color:var(--bad)}.msgs ul.w{background:var(--warn-bg);color:var(--warn)}
.fld{display:grid;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
@media (max-width:480px){.fld{grid-column:1/-1}}
.fld label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;width:100%;min-width:0}
.fld [aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fld .hint{font-size:.74rem;color:var(--muted)}
.fld textarea{min-height:70px;resize:vertical}
.tool{grid-column:1/-1;display:grid;gap:8px}
.tool .item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.tool textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100vw - 32px)}
.confirm{grid-column:1/-1;font-size:.95rem;margin:0}
body.ro .w{display:none!important}
.qr-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.qr{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);width:180px;height:180px;flex:none}
.qr img,.qr canvas{width:160px!important;height:160px!important;display:block}
.linkbox{font-family:var(--f-mono);font-size:.78rem;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
body:not(.locked) #v-lock{display:none}
:root{--lk-field:#F3F2EC;--lk-focus:#1B3A66;--lk-btn:#234E8C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lk-field:#222C28;--lk-focus:#8DB4F0;--lk-btn:#3A6BB5}}
:root[data-theme="dark"]{--lk-field:#222C28;--lk-focus:#8DB4F0;--lk-btn:#3A6BB5}
body.locked main>section:not(#v-lock),body.locked .tabs,body.locked #btn-tools,body.locked #btn-lock{display:none!important}
.lock{max-width:440px;margin:28px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px 26px;display:grid;gap:16px}
.lk-eyebrow{font-family:var(--f-body);font-size:.82rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lk-title{font-family:var(--f-body);font-weight:700;font-size:1.75rem;line-height:1.3;text-transform:none;letter-spacing:0;margin:-4px 0 0;color:var(--ink)}
.lk-f{display:grid;gap:8px}
.lk-f label{font-weight:700;font-size:.98rem;color:var(--ink)}
.lk-in{font:inherit;font-size:1.05rem;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--lk-field);color:var(--ink);padding:14px 16px;min-height:54px}
.lk-in:focus{outline:none;border:2px solid var(--lk-focus);padding:13px 15px}
.lk-pin{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.45em;min-height:64px}
.lk-btn{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:10px;background:var(--lk-btn);color:#fff;min-height:54px;cursor:pointer}
.lk-btn:disabled{opacity:.6}
.lk-btn2{font:inherit;font-weight:700;font-size:.95rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:48px;cursor:pointer}
.lk-help{margin:0;font-size:.9rem;color:var(--ink);background:var(--sunk);border-radius:10px;padding:12px}
body.locked header.top{display:none}
body.locked::before{background:var(--bg)}
.lock p{margin:0;color:var(--muted);font-size:.9rem}
.lock-err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin:0}
.code-big{grid-column:1/-1;font-family:var(--f-mono);font-size:2.4rem;font-weight:600;letter-spacing:.3em;text-align:center;background:var(--sunk);border-radius:10px;padding:14px 8px}
.who{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.card:hover{border-color:var(--muted)}}
.res-pos{color:var(--ok)}.res-neg{color:var(--bad)}
#print-zone{display:none}
.inv{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#111;font-family:"IBM Plex Sans",Arial,sans-serif;font-size:13px;line-height:1.45;padding:28px;max-width:780px;margin:0 auto}
.inv h1{font-family:"Barlow Condensed",Arial Narrow,Arial,sans-serif;font-size:28px;margin:0;letter-spacing:.04em;color:#234E8C}
.inv .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #234E8C;padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.inv .org b{font-size:15px}.inv .org{font-size:12px;color:#333}
.inv table{width:100%;border-collapse:collapse;margin:12px 0}
.inv th{background:#234E8C;color:#fff;text-align:left;padding:7px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:normal}
.inv td{border-bottom:1px solid #ddd;padding:7px;vertical-align:top;white-space:normal}
.inv .r{text-align:right;white-space:nowrap}
.inv .tot td{font-weight:700;border-bottom:0}
.inv .big td{font-size:15px;background:#FBEFE7}
.inv .box{border:1px solid #ccc;border-radius:6px;padding:10px;margin:8px 0}
.inv .sig{display:flex;justify-content:space-between;margin-top:40px;gap:20px}
.inv .sig div{flex:1;border-top:1px solid #999;padding-top:6px;font-size:12px;text-align:center}
.inv .pied{margin-top:28px;font-size:10px;color:#666;text-align:center;border-top:1px solid #ddd;padding-top:8px}
.inv-prev{grid-column:1/-1;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.inv-prev .inv{min-width:620px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  body>*:not(#print-zone){display:none!important}
  #print-zone{display:block!important}
  .inv{padding:0;max-width:none}
}

body.nown .own{display:none!important}
.res-pos{color:var(--ok)}.res-neg{color:var(--bad)}
.who{font-weight:600;color:var(--ink)}
.dossier{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);padding:6px 8px;max-width:220px}
.lines{display:grid;gap:4px;font-size:.86rem}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
.decl{display:grid;gap:10px}
.decl .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.big{font-family:var(--f-disp);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.el{display:grid;gap:6px}
.el .ln{display:grid;grid-template-columns:minmax(0,2fr) 90px 90px 28px;gap:6px;align-items:end}
.el .ln.fac{grid-template-columns:minmax(0,2fr) 64px 96px 84px 28px}
@media (max-width:480px){.el .ln.fac{grid-template-columns:minmax(0,1fr) 56px 84px;}.el .ln.fac .tv{grid-column:1/3}}
.el input,.el select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 8px;width:100%;min-width:0}
.el label{font-size:.72rem;font-weight:600;color:var(--muted)}
.x{font:inherit;border:0;background:transparent;color:var(--bad);cursor:pointer;font-weight:700;padding:8px 4px}
.tag{font-family:var(--f-mono);font-size:.74rem;font-weight:600;border:1.5px solid currentColor;border-radius:4px;padding:0 5px;white-space:nowrap}
td.c,th.c{text-align:center}
tr.sub td{font-weight:700;background:var(--sunk)}
tr.grand td{font-weight:700;font-size:.95rem;border-top:2px solid var(--ink)}
.acc{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
/* Documents imprimables (facture A4, bulletin, états) */
#print-zone{display:none}
.doc{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#111;font-family:"IBM Plex Sans",Arial,sans-serif;font-size:12px;line-height:1.4;padding:18px;max-width:800px;margin:0 auto}
.doc h1{font-size:20px;margin:0 0 4px}.doc h2{font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:#111}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th,.doc td{border:1px solid #bbb;padding:5px 6px;white-space:normal;color:#111}
.doc th{background:#E8EEF7;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.doc .r{text-align:right}.doc .muted{color:#555}
.doc .hdr{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #234E8C;padding-bottom:10px;margin-bottom:12px}
.doc .box{border:1px solid #bbb;padding:8px;border-radius:4px}
.doc .stamp{display:inline-block;border:2px solid #234E8C;color:#234E8C;font-weight:700;padding:4px 8px;border-radius:4px}
.doc-prev{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:60vh}
@media print{
  @page{margin:10mm}
  body{background:#fff!important}
  body>*:not(#print-zone){display:none!important}
  #print-zone{display:block!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true"><rect x="3" y="3" width="24" height="25" rx="2" fill="none" stroke="var(--ink)" stroke-width="2.4"/><path d="M8 10h14M8 15h14M8 20h8" stroke="var(--accent)" stroke-width="2.4"/><circle cx="31" cy="21" r="7" fill="var(--signal)"/><path d="M28 21h6M31 18v6" stroke="var(--signal-ink)" stroke-width="2"/></svg>
      <div class="t"><h1 id="shop-name">Comptabilité</h1><p><select id="dossier" class="dossier" aria-label="Entreprise" hidden></select><span id="sync" class="sync busy" role="status">Connexion…</span><span id="who" class="who"></span></p></div>
      <button class="btn sm ghost" id="btn-lock" type="button" hidden>Verrouiller</button>
      <button class="btn sm" id="btn-tools" type="button">Outils</button>
    </div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sp=s=>s.replace(/ | /g," ");
const fcfa=n=>sp((Math.round(Number(n)||0)).toLocaleString("fr-FR"))+" FCFA";
const fnum=n=>sp((Math.round(Number(n)||0)).toLocaleString("fr-FR"));
const nb=n=>sp((Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:2}));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dayShift=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fdate=d=>d?new Date(d.slice(0,10)+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fdt=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const fhm=iso=>iso?new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const num=v=>{const s=String(v??"").replace(/\s/g,"").replace(",",".");return s===""?null:Number(s)};

const state={dossiers:[],ecritures:[],factures:[],employes:[],paies:[],declarations:[],comptes:[]};
let mode="loading", isOwner=false, isGest=false, isMgr=false, gLoaded=false, pickG=null, lockSig="";
let lastErr=null, slowLoad=false, fdb=null, auth=null, authUser=null, adminUid=null, adminEmail=null, pendingCode=null, setupBusy=false, dataUnsubs=[];
let shop={nom:"Comptabilité",ville:"",tel:""};
const DOMAIN="compta-socobema.app";
const MOD="compta", MOD_L="Comptabilité";
/* ================= NOYAU STANDARD (multi-coopératives ou copie autonome) =================
   config.js définit window.FIREBASE_CONFIG et window.PLATEFORME = { mode:"multi"|"solo", fournisseur:{nom,tel} }.
   Mode « multi » : une seule base pour toutes les coopératives ; chaque lien porte ?org=identifiant ;
   les données de la coopérative sont rangées sous orgs/{org}/modules/{module}/…
   Mode « solo » : une copie par coopérative, avec sa propre base Firebase. */
const PF=window.PLATEFORME||{mode:"solo",fournisseur:{}};
const MULTI=PF.mode==="multi";
const QS=new URLSearchParams(location.search);
const ORGID=MULTI?String(QS.get("org")||"").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40):"";
const PFX=MULTI&&ORGID?`orgs/${ORGID}/modules/${MOD}/`:"";
const col=n=>fdb.collection(PFX+n);
const docr=p=>fdb.doc(PFX+p);
const ACCESS_URL=location.origin+location.pathname+(MULTI&&ORGID?"?org="+ORGID:"");
const withQ=(url,k,v)=>url+(url.includes("?")?"&":"?")+k+"="+encodeURIComponent(v);
let BRAND={nom:"",sigle:"",tel:"",adresse:"",ville:"",snt:"",logo:"",couleur:"",signataire:"",actif:true,expire:"",modules:[]}, brandLoaded=!MULTI, brandExists=false;
const brandName=(def)=>BRAND.sigle||BRAND.nom||def||"";
function brandBad(){
  if(!MULTI) return "";
  if(!ORGID) return "Lien incomplet : demandez à votre fournisseur le lien de votre coopérative.";
  if(!brandLoaded) return "";
  if(!brandExists) return "Coopérative introuvable. Vérifiez le lien reçu.";
  if(BRAND.actif===false) return `L'accès de ${esc(brandName())} est suspendu.`;
  if(BRAND.expire&&BRAND.expire<today()) return `L'abonnement de ${esc(brandName())} a expiré le ${new Date(BRAND.expire+"T00:00:00").toLocaleDateString("fr-FR")}.`;
  if(!(BRAND.modules||[]).includes(MOD)) return `Ce module n'est pas inclus dans l'abonnement de ${esc(brandName())}.`;
  return "";
}
function brandLockHTML(m){
  const f=PF.fournisseur||{};
  return `<div class="lock">${BRAND.logo?`<img src="${esc(BRAND.logo)}" alt="" style="max-height:64px;max-width:180px;object-fit:contain">`:""}<div class="lk-eyebrow">Accès</div><h2 class="lk-title">${esc(BRAND.nom||"Plateforme de gestion")}</h2>
    <p style="color:var(--ink);font-size:1rem">${m}</p>${f.tel?`<p>Pour renouveler ou rétablir l'accès, contactez ${esc(f.nom||"votre fournisseur")} au <b>${esc(f.tel)}</b>.</p><a class="lk-btn" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/${String(f.tel).replace(/\D/g,"").replace(/^(\d{10})$/,"225$1")}?text=${encodeURIComponent("Bonjour, je vous contacte pour l'abonnement de "+(BRAND.nom||ORGID)+".")}" target="_blank" rel="noopener">Contacter par WhatsApp</a>`:""}</div>`;
}
function applyBrand(){
  const n=BRAND.nom||"";
  if(BRAND.couleur&&/^#[0-9a-f]{6}$/i.test(BRAND.couleur)){const r=document.documentElement.style;r.setProperty("--accent",BRAND.couleur);r.setProperty("--accent-ink","#FFFFFF");r.setProperty("--lk-btn",BRAND.couleur);
    const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=BRAND.couleur}
  const svg=document.querySelector(".brand svg"); let img=document.getElementById("brand-logo");
  if(BRAND.logo){ if(!img){img=document.createElement("img");img.id="brand-logo";img.alt="";img.style.cssText="height:36px;width:auto;max-width:90px;object-fit:contain;border-radius:6px;flex:none";svg&&svg.replaceWith(img)} img.src=BRAND.logo }
  const tag=document.getElementById("brand-tag"); if(tag) tag.textContent=n?(BRAND.sigle||n):"";
  if(n) document.title=(BRAND.sigle||n)+" · "+MOD_L;
  let w=document.getElementById("abo-warn");
  const days=BRAND.expire?Math.ceil((new Date(BRAND.expire+"T23:59:59")-new Date())/864e5):999;
  if(MULTI&&brandExists&&days>=0&&days<=7&&!brandBad()){
    if(!w){w=document.createElement("div");w.id="abo-warn";w.className="banner warn";document.querySelector("main").prepend(w)}
    w.innerHTML=`<span>L'abonnement expire ${days===0?"aujourd'hui":"dans "+days+" jour(s)"} (${new Date(BRAND.expire+"T00:00:00").toLocaleDateString("fr-FR")}). Pensez à le renouveler${PF.fournisseur&&PF.fournisseur.tel?" auprès de "+esc(PF.fournisseur.nom||"votre fournisseur")+" ("+esc(PF.fournisseur.tel)+")":""}.</span>`;
  } else if(w) w.remove();
}
function startBrand(){
  const ref=MULTI?(ORGID?fdb.doc("orgs/"+ORGID):null):fdb.doc("config/marque");
  if(!ref){brandLoaded=true;lockSig="";render();return}
  ref.onSnapshot(s=>{brandExists=s.exists;BRAND={...BRAND,...(s.exists?s.data():{})};brandLoaded=true;applyBrand();lockSig="";render()},
    ()=>{brandLoaded=true;lockSig="";render()});
}
/* Personnalisation (copie autonome) : nom, sigle, logo, couleur, coordonnées — par le propriétaire, depuis Outils. */
function compressLogo(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/png"))};im.onerror=ko;im.src=r.result};r.onerror=ko;r.readAsDataURL(file)})}
function openMarque(){
  let logo=BRAND.logo||"";
  const F=[["nom","Nom complet de la structure","text",1],["sigle","Sigle / nom court","text"],["snt","N° d'agrément / code SNT / RCCM","text"],["tel","Téléphone","tel"],["adresse","Adresse","text"],["ville","Ville","text"],["signataire","Signataire des documents","text",1],["couleur","Couleur principale","color"]];
  document.getElementById("dlg-t").textContent="Personnaliser la plateforme";
  document.getElementById("dlg-b").innerHTML=`<div class="msgs" id="dlg-msgs"></div>`+F.map(([k,l,t,full])=>`<div class="fld${full?" full":""}"><label for="mq-${k}">${l}</label><input id="mq-${k}" type="${t}" maxlength="120" value="${esc(BRAND[k]||(k==="couleur"?"#1E6A49":""))}"></div>`).join("")+
    `<div class="fld full"><label for="mq-logo">Logo (image)</label><input id="mq-logo" type="file" accept="image/*"><img id="mq-prev" alt="" style="max-height:60px;max-width:160px;object-fit:contain;${logo?"":"display:none"}" src="${esc(logo)}"></div><p class="lock-err" id="mq-err" style="grid-column:1/-1"></p>`;
  document.getElementById("dlg-f").innerHTML=`<button type="button" class="btn" data-close>Annuler</button><button type="button" class="btn primary" id="mq-save">Enregistrer</button>`;
  ctx={kind:"marque"}; const d=document.getElementById("dlg"); if(!d.open) d.showModal();
  document.getElementById("mq-logo").addEventListener("change",async e=>{const f=e.target.files[0];if(!f) return;try{logo=await compressLogo(f);const p=document.getElementById("mq-prev");p.src=logo;p.style.display=""}catch(_){toast("Image illisible")}});
  document.getElementById("mq-save").addEventListener("click",async()=>{
    const v={}; F.forEach(([k])=>v[k]=document.getElementById("mq-"+k).value.trim());
    if(v.nom.length<3){document.getElementById("mq-err").textContent="Indiquez le nom de la structure.";return}
    const b=document.getElementById("mq-save"); b.disabled=true; b.textContent="Enregistrement…";
    try{await Promise.race([fdb.doc("config/marque").set({...v,logo,majLe:new Date().toISOString(),majPar:authUser.uid}),sleep(1500)]);toast("Personnalisation enregistrée");d.close()}
    catch(x){document.getElementById("mq-err").textContent="Enregistrement refusé ("+((x&&x.code)||"erreur")+").";b.disabled=false;b.textContent="Enregistrer"}
  });
}
document.getElementById("btn-tools").addEventListener("click",()=>{setTimeout(()=>{
  if(MULTI||!isOwner||!document.getElementById("dlg").open) return;
  const b=document.getElementById("dlg-b"); if(!b||b.querySelector("#mq-open")) return;
  b.insertAdjacentHTML("beforeend",`<div class="tool"><h3>Personnalisation</h3><div class="item"><span>Nom, logo, couleur et coordonnées affichés sur la plateforme et les documents</span><button class="btn sm" type="button" id="mq-open">Personnaliser</button></div></div>`);
  b.querySelector("#mq-open").addEventListener("click",openMarque);
},30)});

const sync={cache:{},pending:{},error:false,offline:!navigator.onLine};
const filters={mois:null,facF:"tous",opQ:"",annee:null,etat:"resultat",compte:null};
const SINCE_YEARS=1; // écritures de l'année en cours et de l'année précédente chargées en direct

/* ---------- Données dérivées ---------- */
const alive=c=>state[c].filter(x=>!x.supprime);
const pcaDoc=()=>state.comptes.find(g=>g.id===adminUid);
const vendeurs=()=>state.comptes.filter(g=>g.actif!==false&&g.role!=="pca"&&!g.remplace).sort((a,b)=>(a.nom||"").localeCompare(b.nom||""));
const pool=()=>[pcaDoc(),...vendeurs()].filter(Boolean);
const curG=()=>authUser&&state.comptes.find(g=>g.id===authUser.uid&&g.actif!==false&&!g.remplace);
const isLocked=()=>!!brandBad()||mode!=="db"||!curG();
const myName=()=>isOwner?"Propriétaire":((curG()||{}).nom||"");
const roleOf=g=>g.id===adminUid?"pca":(g.role==="lecture"?"lecture":"comptable");
const ROLE_L={pca:"Propriétaire",comptable:"Comptable",lecture:"Consultation"};

/* ---------- Stockage (Firebase) ---------- */
const inc=n=>firebase.firestore.FieldValue.increment(n);
const stamp=()=>({majLe:new Date().toISOString(),majPar:authUser?authUser.uid:null,par:myName()});
/* Hors connexion, Firestore garde l'écriture et l'envoie au retour du réseau : on n'attend pas le serveur indéfiniment. */
function queued(p){p.catch(e=>toast(errMsg(e)));return Promise.race([p,sleep(1500)])}
function errMsg(e){
  const c=(e&&e.code)||"";
  if(c==="permission-denied") return "Accès refusé : action réservée au propriétaire, ou code plus valide.";
  if(c==="resource-exhausted") return "Limite gratuite du jour atteinte. Réessayez demain.";
  if(c==="auth/requires-recent-login") return "Par sécurité, verrouillez, reconnectez-vous puis réessayez.";
  if(c==="auth/network-request-failed"||c==="unavailable") return "Pas de connexion internet. Réessayez quand le réseau revient.";
  if(/api-key|invalid-api|app-not-authorized/.test(c)) return "Configuration Firebase incorrecte (clé API).";
  if(c==="auth/operation-not-allowed") return "La connexion par e-mail/mot de passe n'est pas activée dans Firebase.";
  if(c==="auth/configuration-not-found"||c==="auth/admin-restricted-operation") return "Authentication n'est pas activée dans Firebase (Sécurité → Authentication → Commencer, puis activer « Adresse e-mail/Mot de passe »).";
  return "L'enregistrement n'a pas abouti. Réessayez."+(c?" (code : "+c+")":"");
}
function newCode(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%900000+100000)}
function rid(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("")}
function newSalt(){const a=new Uint8Array(6);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
/* Numéro de reçu unique même hors connexion et avec plusieurs vendeurs : date + heure + 3 caractères aléatoires. */
function newNum(prefix){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${prefix}-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${rid(3)}`}
async function newAuthUser(code){
  const app=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(window.FIREBASE_CONFIG,"sec");
  const a=app.auth(); const email=`v-${newSalt()}@${DOMAIN}`;
  const cred=await a.createUserWithEmailAndPassword(email,code); await a.signOut();
  return{uid:cred.user.uid,email};
}
function jEntry(action,coll,id,resume,avant){return{le:new Date().toISOString(),majPar:authUser.uid,par:authUser.uid,nom:myName(),action,coll,docId:id,resume:String(resume||"").slice(0,200),avant:avant||null}}
const jRef=()=>col("journal").doc();
const clean=x=>{if(!x)return null;const r={...x};delete r.id;return r};

function subscribeData(){
  dataUnsubs.forEach(u=>u()); dataUnsubs=[];
  if(!authUser){for(const k of ["dossiers","ecritures","factures","employes","paies","declarations"]) state[k]=[];sync.cache={};return}
  const since=(new Date().getFullYear()-SINCE_YEARS)+"-01-01";
  listen([["dossiers",col("dossiers")],["employes",col("employes")],
    ["ecritures",col("ecritures").where("jour",">=",since)],["factures",col("factures").where("jour",">=",since)],
    ["paies",col("paies").where("mois",">=",since.slice(0,7))],["declarations",col("declarations")]]);
  dataUnsubs.push(docr("config/boutique").onSnapshot(s=>{if(s.exists) shop={...shop,...s.data()}; render()},()=>{}));
}
function subscribeOwn(){}
function listen(subs,own){
  for(const [c,q] of subs){
    sync.cache[c]=true;
    dataUnsubs.push(q.onSnapshot({includeMetadataChanges:true},snap=>{
      state[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      sync.cache[c]=snap.metadata.fromCache; sync.pending[c]=snap.metadata.hasPendingWrites; sync.error=false;
      render();
    },e=>{ if(e&&e.code==="permission-denied"){sync.cache[c]=false;if(authUser&&!own) auth.signOut(); return} sync.error=true; showSync(); }));
  }
}
function showBanner(kind,html){const b=$("#banner");b.className="banner "+kind;b.innerHTML=html;b.hidden=false}
function showSync(){
  const el=$("#sync"); let k="ok",t="À jour";
  if(sync.offline){k="bad";t="Hors connexion · enregistré sur le téléphone"}
  else if(sync.error){k="bad";t="Connexion interrompue"}
  else if(Object.values(sync.pending).some(Boolean)){k="busy";t="Envoi en cours…"}
  else if(mode==="loading"||Object.values(sync.cache).some(Boolean)){k="busy";t="Synchronisation…"}
  el.className="sync "+k; el.textContent=t;
}
addEventListener("online",()=>{sync.offline=false;showSync()});
addEventListener("offline",()=>{sync.offline=true;showSync()});

/* Verrouillage automatique après 30 min sans activité (seulement avec réseau). */
const IDLE_MIN=30; let lastAct=Date.now();
try{const v=+localStorage.getItem("c-act"); if(v) lastAct=v}catch(e){}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();try{localStorage.setItem("c-act",String(lastAct))}catch(e){}},{passive:true}));
setInterval(()=>{if(authUser&&navigator.onLine&&Date.now()-lastAct>IDLE_MIN*6e4){auth.signOut();toast("Verrouillé après 30 minutes sans activité.")}},30000);

addEventListener("error",e=>{lastErr={code:(e.message||"erreur script")};if(mode==="loading"){lockSig="";slowLoad=true;render()}});
addEventListener("unhandledrejection",e=>{const r=e.reason||{};lastErr={code:r.code||r.message||String(r)};if(mode==="loading"){lockSig="";slowLoad=true;render()}});
async function init(){
  setTimeout(()=>{if(mode==="loading"){lockSig="";slowLoad=true;render()}},12000);
  render();
  const C=window.FIREBASE_CONFIG;
  if(!window.firebase||!C||!C.apiKey||/COLLER/.test(C.apiKey)){mode="nocfg";render();return}
  try{
    firebase.initializeApp(C); fdb=firebase.firestore(); auth=firebase.auth(); startBrand();
    try{fdb.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}
    try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  }catch(e){mode="nocfg";render();return}
  let cfgLoaded=false, cLoaded=false;
  const update=()=>{
    if(cfgLoaded&&cLoaded){gLoaded=true;mode=adminUid?"db":"setup"}
    isOwner=!!(authUser&&adminUid&&authUser.uid===adminUid);
    const me=authUser&&state.comptes.find(g=>g.id===authUser.uid);
    isGest=!isOwner&&!!(me&&me.role!=="lecture"); isMgr=isOwner||isGest;
    if(authUser&&gLoaded&&mode==="db"&&!setupBusy&&!curG()){auth.signOut();toast("Ce code n'est plus valide. Demandez un nouveau code au propriétaire.")}
    render();
  };
  const applyAdmin=s=>{adminUid=s.exists?s.data().uid:null; adminEmail=s.exists?s.data().email:null; cfgLoaded=true; update()};
  (async()=>{for(let i=0;i<8&&!cfgLoaded;i++){try{applyAdmin(await docr("config/admin").get({source:"server"}));return}catch(e){lastErr=e;await sleep(2500)}}})();
  docr("config/admin").onSnapshot({includeMetadataChanges:true},s=>{ if(s.metadata.fromCache&&!s.exists) return; applyAdmin(s) },
    e=>showBanner("bad","Impossible de lire la configuration ("+esc((e&&e.code)||"erreur")+"). Vérifiez les règles Firestore."));
  docr("config/boutique").get().then(s=>{if(s.exists){shop={...shop,...s.data()};render()}}).catch(()=>{});
  col("comptes").onSnapshot(s=>{state.comptes=s.docs.map(d=>({id:d.id,...d.data()}));cLoaded=true;update()},
    ()=>showBanner("bad","Impossible de lire la liste des accès. Vérifiez les règles Firestore."));
  auth.onAuthStateChanged(u=>{
    if(u&&navigator.onLine&&Date.now()-lastAct>IDLE_MIN*6e4){auth.signOut();return}
    const changed=(u&&u.uid)!==(authUser&&authUser.uid);authUser=u;if(changed) subscribeData(); update()});
}

/* ---------- Écran d'accès ---------- */
const lkHead=()=>`<div class="lk-eyebrow">Accès sécurisé</div><h2 class="lk-title">${esc(BRAND.nom||(shop.nom!=="Comptabilité"?shop.nom:"")||"Comptabilité")}</h2>`;
function renderLock(){
  {const bb=brandBad(); if(bb){if(lockSig!=="B"+bb){lockSig="B"+bb;$("#v-lock").innerHTML=brandLockHTML(bb)}return}}
  const G=pool();
  const sig=mode+"|"+gLoaded+"|"+slowLoad+"|"+shop.nom+"|"+G.map(g=>g.id+":"+g.nom).join(",");
  if(sig===lockSig) return; lockSig=sig;

/* ================= MOTEUR D'ÉCRITURES ================= */
/* Une écriture = { jour, journal, piece, libelle, lignes:[{c:compte, d:débit, k:crédit, t:tiers, tva:code}] }.
   Toujours équilibrée (débit = crédit), jamais modifiée ni effacée : une erreur se corrige par une écriture d'annulation (contre-passation). */
const R=n=>Math.round(+n||0);
function mkLines(L){return L.filter(l=>R(l.d)||R(l.k)).map(l=>{const o={c:String(l.c),d:R(l.d),k:R(l.k)};if(l.t) o.t=String(l.t).slice(0,80);if(l.tva) o.tva=l.tva;return o})}
function checkEcr(e){
  const E=[];
  if(!e.lignes.length) E.push("L'écriture n'a aucune ligne.");
  const td=e.lignes.reduce((s,l)=>s+l.d,0), tk=e.lignes.reduce((s,l)=>s+l.k,0);
  if(td!==tk) E.push(`Écriture déséquilibrée : débit ${fnum(td)} ≠ crédit ${fnum(tk)}.`);
  if(e.lignes.some(l=>l.d<0||l.k<0)) E.push("Montants négatifs interdits.");
  const d=D(); if(d&&d.verrou&&e.jour<=d.verrou) E.push(`La période jusqu'au ${fdate(d.verrou)} est clôturée : choisissez une date après.`);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.jour||"")) E.push("Date invalide.");
  return E;
}
/* Prépare l'écriture dans un lot Firestore (batch). Renvoie sa référence. */
function addEcr(b,e){
  const d=D(); const ref=col("ecritures").doc();
  const lignes=mkLines(e.lignes); const tot=lignes.reduce((s,l)=>s+l.d,0);
  const doc={dossierId:d.id,jour:e.jour,journal:e.journal||"OD",piece:e.piece||"",libelle:String(e.libelle||"").slice(0,140),lignes,totalD:tot,totalC:lignes.reduce((s,l)=>s+l.k,0),
    source:e.source||"manuel",srcId:e.srcId||null,annule:e.annule||null,le:new Date().toISOString(),...stamp()};
  const er=checkEcr(doc); if(er.length) throw {msgs:er};
  b.set(ref,doc); return ref;
}
function reverseOf(e,jour,lib){return{jour,journal:e.journal,piece:e.piece,libelle:lib||("Annulation : "+e.libelle),lignes:e.lignes.map(l=>({...l,d:l.k,k:l.d})),source:"annulation",annule:e.id}}

/* Soldes : mvt(compte prefix, de, à) → {d,k,s=d−k} */
function mvt(prefixes,from,to,ecr){
  const P=[].concat(prefixes); let d=0,k=0;
  for(const e of (ecr||E())){ if(from&&e.jour<from) continue; if(to&&e.jour>to) continue;
    for(const l of e.lignes) if(P.some(p=>l.c.startsWith(p))){d+=l.d;k+=l.k} }

/* ---------- Montant en lettres (factures) ---------- */
function enLettres(n){
  n=Math.round(Math.abs(n));
  const u=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const dz=["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  const cent=x=>{let s="";const c=Math.floor(x/100),r=x%100;
    if(c) s=(c>1?u[c]+" cent":"cent")+(c>1&&!r?"s":"");
    if(r){if(s)s+=" ";
      if(r<20)s+=u[r];else{const d=Math.floor(r/10);let rr=r%10;if(d===7||d===9)rr+=10;
        s+=dz[d];if(d===8&&!rr)s+="s";else if(rr===1&&d<8)s+="-et-un";else if(rr===11&&d===7)s+="-et-onze";else if(rr)s+="-"+u[rr]}}
    return s};
  if(n===0) return "zéro";
  const parts=[];const mi=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1000),r=n%1000;
  if(mi) parts.push(cent(mi)+" milliard"+(mi>1?"s":""));
  if(m) parts.push(cent(m)+" million"+(m>1?"s":""));
  if(k) parts.push(k===1?"mille":cent(k).replace(/s$/,"")+" mille");
  if(r) parts.push(cent(r));
  return parts.join(" ");
}

function echeances(){
  const d=D(); if(!d) return [];
  const p=P(d), out=[], cm=curMonth(), t=today();
  const add=(type,per,label,date,lien)=>{const x=DECL(type,per);const etat=x&&x.statut==="deposee"?"fait":(date<t?"retard":(dayShift(t,7)>=date?"bientot":"avenir"));out.push({type,per,label,date,etat,lien,doc:x})};
  const ex=E().filter(e=>e.journal!=="AN").map(e=>e.jour.slice(0,7)).sort()[0];
  const start=ex||(d.creeLe||today()).slice(0,7);
  for(const m of [prevMonth(prevMonth(cm)),prevMonth(cm),cm].filter(x=>x>=start)){
    const due=j=>nextMonth(m)+"-"+String(j).padStart(2,"0");
    if(d.tva!==false) add("tva",m,"TVA de "+moisL(m),due(p.jourTVA),"e-impots");
    if(EMP().length||PAIES().some(x=>x.mois===m)){
      add("its",m,"Impôts sur salaires (ITS) de "+moisL(m),due(p.jourSal),"e-impots");
      if(!p.cnpsTrim) add("cnps",m,"Cotisations CNPS de "+moisL(m),due(p.jourCNPS),"e-cnps");
      else if(+m.slice(5)%3===0){const q=Math.ceil(+m.slice(5)/3);add("cnps",m.slice(0,4)+"-T"+q,"CNPS "+q+"e trimestre "+m.slice(0,4),due(p.jourCNPS),"e-cnps")}
    }
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

    /* Le numéro est réservé dans « numeros » : si quelqu'un l'a pris au même moment, le serveur refuse et on essaie le suivant. */
    for(let tries=0;tries<6&&!done;tries++){
      facNum=`FAC-${new Date().getFullYear()}-${String(n0+tries).padStart(4,"0")}`;
      const b=fdb.batch(); ref=col("factures").doc(); const lib=`Facture ${facNum} · ${o.cnom}`;
      const lignes=[{c:"411",d:T.ttc,t:o.cnom}];
      for(const [tv,h] of Object.entries(T.parT)) lignes.push({c:o.compte,k:h,tva:tv||null});
      if(T.tva) lignes.push({c:"4431",k:T.tva});
      const er=addEcr(b,{jour:o.jour,journal:"VT",piece:facNum,libelle:lib,lignes,source:"facture",srcId:ref.id});
      let paye=0;
      if(o.mode!=="deferred"){paye=T.ttc;addEcr(b,{jour:o.jour,journal:"TR",piece:facNum,libelle:"Encaissement "+lib,lignes:[{c:MODE_TRESO[o.mode],d:T.ttc},{c:"411",k:T.ttc,t:o.cnom}],source:"encaissement",srcId:ref.id})}
      b.set(col("numeros").doc(d.id+"_"+facNum),{dossierId:d.id,num:facNum,factureId:ref.id,le:new Date().toISOString(),majPar:authUser.uid});
      b.set(ref,{dossierId:d.id,num:facNum,jour:o.jour,client:{nom:o.cnom,ncc:(o.cncc||"").replace(/\s/g,"").toUpperCase(),tel:o.ctel||"",email:o.cmail||""},template:o.template,compte:o.compte,
        lignes:L.map(l=>({desc:l.desc,qte:l.qte,pu:R(l.pu),tva:l.tva||""})),ht:T.ht,tva:T.tva,ttc:T.ttc,mode:o.mode,paye,note:o.note||"",statut:"ok",fne:null,ecrId:er.id,...stamp()});
      b.set(jRef(),jEntry("facture","factures",ref.id,`${lib} : ${fcfa(T.ttc)}`));
      try{await Promise.race([b.commit(),sleep(20000).then(()=>{throw {code:"unavailable"}})]);done=true}
      catch(x){lastErr=x;if(!(x&&x.code==="permission-denied")) break}
    }
    if(!done) throw {msgs:[lastErr&&lastErr.code==="permission-denied"?"Impossible de réserver un numéro de facture. Vérifiez votre accès puis réessayez.":errMsg(lastErr)]};
    toast("Facture "+facNum+" enregistrée");
    setTimeout(()=>showFacture(ref.id,true),80);
  },"Enregistrer la facture");
  const upd=()=>{const T=facTotals(readFacLines());$("#fl-tot").innerHTML=`HT ${fnum(T.ht)} · TVA ${fnum(T.tva)} · <b>TTC ${fcfa(T.ttc)}</b>`};
  $("#fl").addEventListener("input",upd); $("#fl").addEventListener("change",upd); upd();
}

function bareme(x,p){let t=0,lo=0;for(const [hi,r] of p.itsTranches){if(x>lo){t+=(Math.min(x,hi)-lo)*r/100}lo=hi;if(x<=hi) break}return t}
function ricf(parts,p){const k=Math.min(5,Math.max(1,Math.round((+parts||1)*2)/2));return p.ricf[k]??p.ricf[String(k)]??0}
function calcPaie(e,x,p){
  const base=R(x.base),pr=R(x.primes),hs=R(x.hs),avn=R(x.avn),tr=R(x.transport),av=R(x.avance);
  const brut=base+pr+hs+avn+tr, brutImp=base+pr+hs+avn+Math.max(0,tr-p.transportExo);
  const bRet=Math.min(brutImp,p.plafRet), bPF=Math.min(brutImp,p.plafPF);
  const retS=R(bRet*p.retSal/100), retP=R(bRet*p.retPat/100), pf=R(bPF*p.pf/100), mat=R(bPF*p.mat/100), at=R(bPF*p.at/100);
  const cmuS=brutImp>0?R(p.cmuSal):0, cmuP=brutImp>0?R(p.cmuPat):0;
  const its=Math.max(0,R(bareme(brutImp,p)-ricf(e.parts,p)));
  const contrib=R(brutImp*(e.expat?p.contribExpat:p.contribLocal)/100), ta=R(brutImp*p.ta/100), fpc=R(brutImp*p.fpc/100);
  const net=brut-retS-cmuS-its-av;
  return{eid:e.id,nom:e.nom,poste:e.poste||"",matricule:e.matricule||"",parts:+e.parts||1,expat:!!e.expat,base,primes:pr,hs,avn,transport:tr,avance:av,brut,brutImp,retS,retP,pf,mat,at,cmuS,cmuP,its,contrib,ta,fpc,net,
    chargesPat:retP+pf+mat+at+cmuP, taxesPat:contrib+ta+fpc};
}

let declSel=null;
function tvaCalc(m){
  const from=m+"-01", to=m+"-31", ecr=E().filter(e=>e.source!=="decl-tva");
  const col=mvt("4431",from,to,ecr), ded=mvt("4452",from,to,ecr);
  const credAnt=Math.max(0,mvt("4449",baseDate(prevMonth(m)+"-31"),prevMonth(m)+"-31").s);
  const caT={}; for(const e of ecr){if(e.jour<from||e.jour>to) continue;for(const l of e.lignes) if(l.c.startsWith("7")){const k=l.tva||"HORS";caT[k]=(caT[k]||0)+l.k-l.d}}
  const collectee=col.k-col.d, deductible=ded.d-ded.k, due=collectee-deductible-credAnt;
  return{collectee,deductible,credAnt,due,caT};
}
function cnpsAgg(per){

  return{ms,L,ret:sumK(L,"retS")+sumK(L,"retP"),pf:sumK(L,"pf"),mat:sumK(L,"mat"),at:sumK(L,"at"),cmu:sumK(L,"cmuS")+sumK(L,"cmuP"),masse:sumK(L,"brutImp"),

}

function openDepot(type,per){

function crLines(from,to){
  const net=(pre,sign)=>{const x=mvt(pre,from,to);return sign>0?x.k-x.d:x.d-x.k};
  const ventesM=net("701",1), achatsM=net(["601"],-1), varStock=net("6031",-1);
  const margeCom=ventesM-achatsM-varStock;
  const prod=net(["702","703","704","705","706","707"],1), subv=net("71",1), autresP=net(["75","73","78"],1);
  const achatsAutres=net(["602","604","605","608"],-1), transp=net("61",-1), servExt=net(["62","63"],-1), impots=net("64",-1), autresC=net("65",-1);
  const VA=margeCom+prod+subv+autresP-achatsAutres-transp-servExt-impots-autresC;
  const perso=net("66",-1); const EBE=VA-perso;
  const dot=net("68",-1), rep=net(["79"],1); const RE=EBE-dot+rep;
  const fin=net("77",1)-net("67",-1); const hao=net(["82","84","86","88"],1)-net(["81","83","85"],-1);
  const isb=net("89",-1); const RN=RE+fin+hao-isb;
  return{ventesM,achatsM,varStock,margeCom,prod,subv,autresP,achatsAutres,transp,servExt,impots,autresC,VA,perso,EBE,dot,rep,RE,fin,hao,isb,RN};
}
function bilanData(to){
  const base=baseDate(to), B=balance(base,to), sd=pre=>B.filter(a=>[].concat(pre).some(p=>a.c.startsWith(p)));
  const debit=pre=>sd(pre).reduce((s,a)=>s+Math.max(0,a.d-a.k),0), credit=pre=>sd(pre).reduce((s,a)=>s+Math.max(0,a.k-a.d),0), solde=pre=>sd(pre).reduce((s,a)=>s+(a.d-a.k),0);
  const y=to.slice(0,4), RN=resultat(y+"-01-01",to), RNant=base&&base>=(y+"-01-01")?0:resultat(base,(+y-1)+"-12-31");
  const immoB=debit(["21","22","23","24","25","26","27"]), amort=credit("28")-debit("28");
  const A={immo:immoB-amort,immoB,amort,stocks:solde("3"),clients:debit("41"),autresCre:debit(["40","42","43","44","45","46","47","48"]),treso:debit("5")};
  A.total=A.immo+A.stocks+A.clients+A.autresCre+A.treso;
  const cap=credit("10")-debit("10"), res=credit("11")-debit("11"), ran=(credit(["12"])-debit(["12"]))+(credit("13")-debit("13"))+RNant;
  const Pp={capital:cap,reserves:res,report:ran,resultat:RN,emprunts:credit(["16","17"])-debit(["16","17"]),fournisseurs:credit("40"),fisc:credit(["42","43","44"]),autresDet:credit(["41","45","46","47","48"]),tresoP:credit("5")};
  Pp.cp=Pp.capital+Pp.reserves+Pp.report+Pp.resultat; Pp.total=Pp.cp+Pp.emprunts+Pp.fournisseurs+Pp.fisc+Pp.autresDet+Pp.tresoP;
  return{A,P:Pp};
}

    const E=[]; PAR_F.forEach(([k,l])=>{if(o[k]==null||o[k]<0) E.push(l+" : valeur invalide.")}); ["jourTVA","jourSal","jourCNPS"].forEach(k=>{if(o[k]<1||o[k]>28) E.push("Les jours d'échéance vont de 1 à 28.")});
    check(E,[],c);
    const params={...(d.params||{})}; PAR_F.forEach(([k])=>params[k]=o[k]); params.cnpsTrim=o.cnpsTrim==="oui";
    const b=fdb.batch(); b.update(col("dossiers").doc(id),{params,...stamp()}); b.set(jRef(),jEntry("paramètres","dossiers",id,"Taux paie / impôts modifiés",{params:d.params||{}}));
    await queued(b.commit()); toast("Taux enregistrés");
  });
}
function openVerrou(id){
  const d=state.dossiers.find(x=>x.id===id);
  openForm("Clôturer une période · "+d.nom,[{type:"html",html:`<p class="confirm">Après clôture, plus aucune écriture ne pourra être ajoutée à cette date ou avant (déclarations déposées, exercice terminé). Une erreur se corrigera par une écriture datée après la clôture.</p>`},
    {k:"verrou",l:"Clôturer jusqu'au (inclus)",type:"date",def:d.verrou||prevMonth(curMonth())+"-"+String(new Date(+prevMonth(curMonth()).slice(0,4),+prevMonth(curMonth()).slice(5),0).getDate()).padStart(2,"0")}],{},async(o,c)=>{
    if(!o.verrou) throw {msgs:["Choisissez la date."]};
    if(d.verrou&&o.verrou<d.verrou) throw {msgs:["On ne peut pas rouvrir une période déjà clôturée."]};
    if(o.verrou>=today()) throw {msgs:["La date doit être passée."]};
    const b=fdb.batch(); b.update(col("dossiers").doc(id),{verrou:o.verrou,...stamp()}); b.set(jRef(),jEntry("clôture","dossiers",id,`Période clôturée jusqu'au ${o.verrou}`));
    await queued(b.commit()); toast("Période clôturée");
  },"Clôturer");
}
document.addEventListener("click",e=>{
  const rn=e.target.closest("[data-renew]"); if(rn){const g=state.comptes.find(x=>x.id===rn.dataset.renew);

  const dz=e.target.closest("[data-deact]"); if(dz){const g=state.comptes.find(x=>x.id===dz.dataset.deact);
    openConfirm("Retirer l'accès",`${esc(g.nom)} ne pourra plus ouvrir la plateforme. Son travail passé reste.`,"Retirer l'accès",async()=>{const s=stamp(),b=fdb.batch();b.update(col("comptes").doc(g.id),{actif:false,...s});b.set(jRef(),jEntry("désactivation","comptes",g.id,"Accès retiré : "+g.nom));await queued(b.commit());toast("Accès retiré")});return}
  const ds=e.target.closest("[data-dos]"); if(ds){openDossier(ds.dataset.dos);return}

  const dx=e.target.closest("[data-dos-exo]"); if(dx){selectD(dx.dataset.dosExo);openClotureExo();return}
});
function selectD(id){curD=id;try{localStorage.setItem("c-dossier",id)}catch(_){}render()}
/* ---------- Clôture de l'exercice : à-nouveaux au 1er janvier suivant + période verrouillée ---------- */
function openClotureExo(){
  const d=D(), cl=closings(), y=String(new Date().getFullYear()-1);
  const deja=cl.includes((+y+1)+"-01-01");
  if(deja){toast(`L'exercice ${y} est déjà clôturé.`);return}
  const fin=y+"-12-31", base=baseDate(fin), A=annulees();
  const W=[];
  if(!E().some(e=>e.jour>=y+"-01-01"&&e.jour<=fin)) W.push(`Aucune écriture en ${y}.`);
  if(d.tva!==false&&!(DECL("tva",y+"-12")||{}).statut) W.push("La TVA de décembre n'est pas encore déclarée dans la plateforme.");
  const B=balance(base,fin).filter(a=>a.d!==a.k); const td=B.reduce((s,a)=>s+a.d,0), tk=B.reduce((s,a)=>s+a.k,0);
  if(td!==tk) W.push("La balance n'est pas équilibrée : faites « Vérifier » d'abord.");
  const R0=resultat(base,fin);
  openForm(`Clôturer l'exercice ${y}`,[{type:"html",html:`<p class="confirm">Cette opération :<br>1. reprend au <b>1er janvier ${+y+1}</b> tous les soldes du bilan (caisse, banque, clients, fournisseurs, dettes, capital…) ;<br>2. met le résultat ${y} (<b>${R0>=0?"bénéfice":"perte"} de ${fcfa(Math.abs(R0))}</b>) en attente d'affectation par l'assemblée générale ;<br>3. <b>verrouille définitivement</b> toutes les écritures jusqu'au 31/12/${y}.<br><br>Faites-le une fois les écritures de fin d'année passées (stocks, amortissements) et validées par votre comptable. Téléchargez une sauvegarde avant.</p>`}],{},async(o,c)=>{
    check([],W.length?W:[`Confirmez-vous la clôture définitive de ${y} ?`],c);
    const m={}; for(const e of E()){ if((base&&e.jour<base)||e.jour>fin) continue;
      for(const l of e.lignes){ if(!/^[1-5]/.test(l.c)) continue; const k=l.c+"|"+((l.c.startsWith("41")||l.c.startsWith("40"))?(l.t||""):""); const x=m[k]||(m[k]={c:l.c,t:k.split("|")[1],s:0}); x.s+=l.d-l.k } }
    let L=Object.values(m).filter(x=>x.s).map(x=>({c:x.c,t:x.t||undefined,d:Math.max(0,x.s),k:Math.max(0,-x.s)}));
    if(L.length>450){const g={};L.forEach(l=>{const k=l.c;const x=g[k]||(g[k]={c:k,s:0});x.s+=l.d-l.k});L=Object.values(g).filter(x=>x.s).map(x=>({c:x.c,d:Math.max(0,x.s),k:Math.max(0,-x.s)}))}
    const net=L.reduce((s,l)=>s+l.d-l.k,0);
    if(net>0) L.push({c:"131",k:net}); else if(net<0) L.push({c:"139",d:-net});
    if(L.length<2) throw {msgs:["Aucun solde à reprendre."]};
    const b=fdb.batch();
    addEcr(b,{jour:(+y+1)+"-01-01",journal:"AN",piece:"CLOT-"+y,libelle:`À-nouveaux : clôture de l'exercice ${y}`,lignes:L,source:"cloture-exo"});
    if(!d.verrou||d.verrou<fin) b.update(col("dossiers").doc(d.id),{verrou:fin,...stamp()});
    b.set(jRef(),jEntry("clôture exercice","dossiers",d.id,`Exercice ${y} clôturé (résultat ${fcfa(net)})`));
    await Promise.race([b.commit(),sleep(20000)]); toast(`Exercice ${y} clôturé`);
  },"Clôturer définitivement");
}
/* ---------- Contrôle de cohérence ---------- */
function showControle(){
  const d=D(), A=annulees(), out=[]; const ok=(t)=>out.push(["ok",t]), ko=(t)=>out.push(["bad",t]), wa=(t)=>out.push(["warn",t]);
  const bad=E().filter(e=>e.totalD!==e.totalC||e.lignes.reduce((s,l)=>s+l.d,0)!==e.lignes.reduce((s,l)=>s+l.k,0));
  bad.length?ko(`${bad.length} écriture(s) déséquilibrée(s).`):ok(`${E().length} écritures, toutes équilibrées.`);
  const B=balance(); const td=B.reduce((s,a)=>s+a.d,0), tk=B.reduce((s,a)=>s+a.k,0); td===tk?ok("Balance générale équilibrée."):ko(`Balance déséquilibrée de ${fcfa(td-tk)}.`);
  const y=String(new Date().getFullYear()); const bl=bilanData(y+"-12-31"); bl.A.total===bl.P.total?ok("Bilan : actif = passif."):ko(`Bilan : écart de ${fcfa(bl.A.total-bl.P.total)}.`);
  const Fa=F().filter(f=>f.statut!=="annulee");
  const sansEcr=Fa.filter(f=>!state.ecritures.some(e=>e.srcId===f.id&&e.source==="facture")&&f.jour>=(+y-1)+"-01-01"); sansEcr.length?ko(`${sansEcr.length} facture(s) sans écriture comptable : ${sansEcr.map(f=>f.num).join(", ")}.`):ok("Chaque facture a son écriture.");
  const encF=Fa.filter(f=>{const s=state.ecritures.filter(e=>e.srcId===f.id&&e.source==="encaissement"&&!A.has(e.id)&&!e.annule).reduce((t,e)=>t+e.totalD,0);return s!==R(f.paye)});
  encF.length?wa(`${encF.length} facture(s) dont le montant payé ne correspond pas aux encaissements : ${encF.map(f=>f.num).join(", ")}.`):ok("Encaissements des factures cohérents.");
  const nums=Fa.map(f=>f.num), dup=nums.filter((n,i)=>nums.indexOf(n)!==i); dup.length?ko("Numéros de facture en double : "+[...new Set(dup)].join(", ")):ok("Aucun numéro de facture en double.");
  const nf=Fa.filter(f=>!(f.fne&&f.fne.ref)); nf.length?wa(`${nf.length} facture(s) sans numéro FNE.`):ok("Toutes les factures ont leur numéro FNE.");
  TRESO.forEach(([c,l])=>{const s=tresoSolde(c);if(s<0) ko(`${l} négative (${fcfa(s)}) : une recette manque ou une dépense est en trop.`)});
  if(!E().some(e=>e.journal==="AN")) wa("Soldes de départ non saisis : le bilan sera incomplet.");
  const ech=echeances().filter(x=>x.etat==="retard"); ech.length?wa(`${ech.length} déclaration(s) en retard : ${ech.map(x=>x.label).join(" ; ")}.`):ok("Aucune déclaration en retard.");
  const pa=PAIES().filter(p=>!p.payeLe); if(pa.length) wa(`Salaires non payés pour : ${pa.map(p=>moisL(p.mois)).join(", ")}.`);
  const py=String(+y-1); if(E().some(e=>e.jour.startsWith(py))&&!closings().includes(y+"-01-01")) wa(`L'exercice ${py} n'est pas clôturé (Outils → Clôturer l'exercice, après validation du comptable).`);
  const nbad=out.filter(x=>x[0]==="bad").length, nw=out.filter(x=>x[0]==="warn").length;
  $("#dlg-t").textContent="Vérification · "+d.nom;
  $("#dlg-b").innerHTML=`<div class="msgs" id="dlg-msgs"></div><div class="banner ${nbad?"bad":nw?"warn":"info"}" style="grid-column:1/-1"><span>${nbad?nbad+" problème(s) à corriger":nw?"Comptabilité cohérente, "+nw+" point(s) à surveiller":"Tout est cohérent ✓"}</span></div>
    <div class="full" style="grid-column:1/-1">${out.map(([k,t])=>`<div class="alert"><span class="pill nodot ${k==="ok"?"p-ok":k==="bad"?"p-bad":"p-warn"}">${k==="ok"?"OK":k==="bad"?"À corriger":"Attention"}</span><span style="flex:1">${esc(t)}</span></div>`).join("")}</div>`;
  $("#dlg-f").innerHTML=`<button type="button" class="btn primary" data-close>Fermer</button>`;
  ctx={kind:"info"}; if(!$("#dlg").open) $("#dlg").showModal();
}
async function backup(){
  toast("Préparation de la sauvegarde…");
  const out={app:"comptabilite",version:1,le:new Date().toISOString()};
  for(const c of ["dossiers","ecritures","factures","employes","paies","declarations","comptes"]){const s=await col(c).get(); out[c]=s.docs.map(d=>({id:d.id,...d.data()}))}
  out.comptes=out.comptes.map(({email,...r})=>r);
  saveBlob(new Blob([JSON.stringify(out)],{type:"application/json"}),`sauvegarde_comptabilite_${today()}.json`);
  try{localStorage.setItem("c-bak",new Date().toISOString())}catch(e){}
  renderBanners(); toast("Sauvegarde téléchargée");
}
async function showJournal(){
  $("#dlg-t").textContent="Historique des actions";
  $("#dlg-b").innerHTML=`<p class="confirm">Chargement…</p>`; $("#dlg-f").innerHTML=`<button type="button" class="btn primary" data-close>Fermer</button>`; ctx={kind:"info"};
  if(!$("#dlg").open) $("#dlg").showModal();
  try{const s=await col("journal").orderBy("le","desc").limit(200).get();
    $("#dlg-b").innerHTML=`<div class="full scroll" style="grid-column:1/-1"><table><tbody>${s.docs.map(d=>{const j=d.data();return `<tr><td class="trace">${fdt(j.le)}</td><td style="white-space:normal"><b>${esc(j.nom||"")}</b> · ${esc(j.resume||j.action)}</td></tr>`}).join("")||"<tr><td>Aucune action.</td></tr>"}</tbody></table></div>`}
  catch(e){$("#dlg-b").innerHTML=`<p class="confirm">${esc(errMsg(e))}</p>`}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  const own=["compta-new","lect-new","my-code","backup","journal","dos-new"];
  if(own.includes(a)&&!isOwner){toast("Réservé au propriétaire.");return}
  const wr=["fac-new","rec-new","dep-new","vir-new","od-new","ouverture","emp-new"];
  if(wr.includes(a)&&ro()){toast("Accès en consultation seulement.");return}
  try{switch(a){
    case "fac-new": openFacture(); break;
    case "rec-new": openRecDep(false); break;
    case "dep-new": openRecDep(true); break;
    case "vir-new": openVirement(); break;
    case "od-new": openOD(); break;
    case "ouverture": openOuverture(); break;
    case "emp-new": openEmploye(); break;
    case "dos-new": openDossier(); break;
    case "backup": await backup(); break;
    case "journal": await showJournal(); break;
    case "copy-link": try{await navigator.clipboard.writeText(ACCESS_URL);toast("Lien copié")}catch(_){toast("Sélectionnez le lien et copiez-le.")} break;
    case "compta-new": case "lect-new": { const role=a==="lect-new"?"lecture":"comptable";
      openForm(role==="lecture"?"Nouvel accès en consultation":"Nouveau comptable",[{k:"nom",l:"Nom",req:true,full:true}],{},async(o,c)=>{
        const E=[]; if(!o.nom||o.nom.length<2) E.push("Indiquez le nom.");
        if(pool().find(g=>norm(g.nom)===norm(o.nom))) E.push("Ce nom existe déjà.");
        if(!navigator.onLine) E.push("Il faut une connexion internet pour créer un accès.");
        check(E,[],c); const code=await createCompte(o.nom,null,role); setTimeout(()=>showCode(o.nom,code),50);
      },"Créer l'accès"); break; }
    case "my-code":
      openForm("Changer mon code",[{k:"p1",l:"Nouveau code (6 chiffres)",type:"password"},{k:"p2",l:"Retapez le code",type:"password"}],{},async(o,c)=>{
        if(!/^\d{6}$/.test(o.p1||"")) throw {msgs:["Le code doit contenir exactement 6 chiffres."]};
        if(o.p1!==o.p2) throw {msgs:["Les deux codes ne sont pas identiques."]};
        await auth.currentUser.updatePassword(o.p1); toast("Code changé");},"Changer"); break;
  }}catch(err){if(err&&err.msgs) toast(err.msgs[0]); else toast(errMsg(err))}
});

setView(view);
init();
