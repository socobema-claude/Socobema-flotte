<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5E37">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SOCOBEMA Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : progiciel de gestion — barre latérale vert forêt groupée par métier, barre supérieure avec actions, contenu en panneaux blancs et tableaux denses */
:root{
  --bg:#EEF1EE; --surface:#ffffff; --surface-2:#F4F6F4; --ink:#17201C; --muted:#5A6862; --faint:#8A968F; --line:#D3DBD6;
  --primary:#2E5E37; --primary-ink:#ffffff; --gold:#E2A410;
  --cocoa:#7a4a2e; --coffee:#3f2d22; --cashew:#d29b2c;
  --blue:#234E8C; --good:#1E7A45; --good-bg:#DDEFE3; --warn:#9A6400; --warn-bg:#F6EBD2; --bad:#B3261E; --bad-bg:#F7DEDA;
  --shadow:none;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211E; --surface-2:#1E2824; --ink:#E7EEEA; --muted:#97A59F; --faint:#6F7D77; --line:#2E3A35;
  --primary:#4F9A5E; --primary-ink:#06140a; --gold:#E9B43A;
  --cocoa:#d29a76; --coffee:#c9a68d; --cashew:#e8b65a;
  --blue:#7FA8E6; --good:#6CC79A; --good-bg:#183327; --warn:#E7B24C; --warn-bg:#352a12; --bad:#F0857A; --bad-bg:#3a1b18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211E; --surface-2:#1E2824; --ink:#E7EEEA; --muted:#97A59F; --faint:#6F7D77; --line:#2E3A35;
  --primary:#4F9A5E; --primary-ink:#06140a; --gold:#E9B43A;
  --cocoa:#d29a76; --coffee:#c9a68d; --cashew:#e8b65a;
  --blue:#7FA8E6; --good:#6CC79A; --good-bg:#183327; --warn:#E7B24C; --warn-bg:#352a12; --bad:#F0857A; --bad-bg:#3a1b18; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
body{display:flex;flex-direction:column;min-height:100%}main{flex:1}
button{font:inherit;color:inherit}
/* En-tête façon suite SOCOBEMA */
.hd{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hd .btn.sec{min-height:44px;padding:9px 20px;font-size:16px;border-radius:10px}
.hd-in{max-width:1180px;margin:0 auto;padding-block:18px 4px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brandrow{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;flex:none}
.bt{min-width:0;display:flex;flex-direction:column}
.bt b{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.02em;line-height:1}
.bt>span{font-size:16px;color:var(--muted);display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.role{font-weight:600;color:var(--ink)}
.hd-act{margin-left:auto;display:flex;gap:10px;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:600;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:currentColor}
.status.local{color:var(--warn)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 15px 12px;border-bottom:4px solid transparent;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.tabs .badge{font-family:var(--f-num);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;letter-spacing:0}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:250px;display:flex;flex-direction:column;z-index:25}
.menu-pop button{all:unset;cursor:pointer;padding:10px 12px;border-radius:6px}
.menu-pop .mh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 12px 4px}
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.lockbox input{text-align:center;font-family:var(--f-num);font-size:26px;letter-spacing:.4em}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--surface-2)}
.ph{display:flex;flex-direction:column;gap:4px}
.ph h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.4vw,40px);letter-spacing:.03em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:17px;max-width:80ch}
.ft{border-top:1px solid var(--line);background:var(--surface)}
.ft-in{max-width:1180px;margin:0 auto;font-size:12px;color:var(--faint);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{min-width:0}
.content{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:22px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;letter-spacing:.05em;text-transform:uppercase}
.lbl{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0;max-width:72ch}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;cursor:pointer;border-radius:8px;padding:9px 16px;border:1px solid transparent;background:var(--primary);color:var(--primary-ink);white-space:nowrap;line-height:1.3}
.btn:hover{filter:brightness(1.07)}
.btn svg{width:16px;height:16px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.out{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.chipsf{display:flex;gap:10px;flex-wrap:wrap}.chipsf button{font:inherit;font-size:16px;font-weight:500;padding:9px 20px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}.chipsf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.icon{padding:5px;border-color:transparent;background:transparent;color:var(--muted)}
.btn.icon:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .top{display:flex;justify-content:space-between;align-items:center}
.kpi .ic{display:none}
.kpi .ic svg{width:17px;height:17px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4.6vw,48px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .s{font-size:15px;color:var(--muted)}
.kpi .v.g{color:var(--good)}.kpi .v.w{color:var(--warn)}.kpi .v.r,.kpi .v .out{color:var(--bad)}

.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-b.flush{padding:0}

/* Stock */
.srow{display:grid;grid-template-columns:96px minmax(0,1fr) 110px;gap:14px;align-items:center}
.bar{height:10px;background:var(--surface-2);border-radius:2px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.q{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;font-weight:600}
.q small{display:block;font-weight:500;color:var(--faint);font-size:11px}
.prod{display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
.prod i{width:8px;height:8px;border-radius:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Alertes */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .dot{width:8px;height:8px;border-radius:50%}
.alert b{font-weight:600;display:block}
.alert span{font-size:12.5px;color:var(--muted)}

/* Tableaux */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 220px;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search input{padding-left:34px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:transparent}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.num{text-align:right!important;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.ref{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;font-size:14px;font-weight:600;padding:5px 14px;border-radius:9px;white-space:nowrap;border:0;cursor:pointer}
.tag.ok{color:var(--good);background:var(--good-bg)}
.tag.wait{color:var(--warn);background:var(--warn-bg)}
.tag.no{color:var(--bad);background:var(--bad-bg)}
.in{color:var(--good)} .out{color:var(--bad)}
.acts{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.empty{padding:40px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:34px;height:34px;color:var(--faint)}
.empty b{color:var(--ink);font-size:15px}

/* Formulaires */
.grid-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-f .full{grid-column:1/-1}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink);min-width:0}
label.fl em{font-style:normal;color:var(--faint);font-weight:400}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.sumline b{font-family:var(--f-num);font-size:18px}

/* Fenêtres */
.overlay{position:fixed;inset:0;background:rgba(8,20,14,.45);z-index:50;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:flex-start;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px}
.sheet{background:var(--surface);width:min(540px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-right:env(safe-area-inset-right,0px)}
.overlay.center .sheet{height:auto;max-height:calc(100% - 20px);border-radius:10px;width:min(560px,100%);padding-right:0}
.overlay.center .sheet.wide{width:min(760px,100%)}
.art{padding:0 16px 6px}.art h3{font-family:var(--f-display);font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}.art p{margin:0 0 6px;line-height:1.6;text-align:justify;max-width:none}.parties{padding:12px 16px;line-height:1.65}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);padding-top:max(16px,env(safe-area-inset-top,0px))}
.overlay.center .sheet-h{padding-top:16px}
.sheet-h h2{font-size:18px}
.sheet-b{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.sheet-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.dl div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* Reçu */
.doc{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;font-size:13px}
.doc-h{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:2px solid var(--ink)}
.doc-h b{font-family:var(--f-display);font-size:15px;display:block;letter-spacing:.02em}
.doc-h small{color:var(--muted);font-size:11.5px;display:block}
.doc-t{display:flex;justify-content:space-between;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
.doc table td{padding:7px 16px}
.doc .total td{font-weight:700;font-size:15px;border-top:2px solid var(--ink)}
.doc-sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:26px 16px 14px;font-size:11.5px;color:var(--muted)}
.doc-sig div{border-top:1px solid var(--line);padding-top:6px}

/* Graphique */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:7px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.scrim{display:none}
body.r-lecture [data-form],body.r-lecture .tag[data-pay],body.r-lecture .tag[data-enc],body.r-lecture .tag[data-part],body.r-lecture .tag[data-joint],body.r-lecture .tag[data-csign],body.r-lecture .tag[data-pact],body.r-lecture #fCall{pointer-events:none}
body.r-lecture [data-form],body.r-lecture #fCall,body.r-lecture .sheet-f [form="fCall"]{display:none!important}
body.r-peseur [data-form="vente"],body.r-peseur [data-form="mvt"],body.r-peseur [data-form="contrat"],body.r-peseur [data-form="pisteur"],body.r-peseur [data-form="dirigeant"],body.r-peseur [data-form="avance"],body.r-peseur [data-form="glink"]{display:none!important}
body.r-nonpca [data-askdel],body.r-nonpca #demo,body.r-nonpca [data-plink]{display:none!important}
.who-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.who-row:last-child{border-bottom:0}
/* Répertoire d'appel */
.ct-list{display:flex;flex-direction:column}
.ct-sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 18px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ct{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.ct:last-child{border-bottom:0}
.ct:hover{background:var(--surface-2)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.03em;flex:none;--c:var(--primary);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.av.t-Conseil{--c:var(--gold)}.av.t-Pisteur{--c:var(--blue)}.av.t-Personnel{--c:var(--muted)}
.av.xl{width:76px;height:76px;font-size:28px}
.ct-m{min-width:0;display:flex;flex-direction:column}
.ct-m .nm{all:unset;cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-m .nm:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
.ct-m span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-tel{font-family:var(--f-num);font-size:14px;color:var(--ink);white-space:nowrap}
.ct-a{display:flex;gap:8px;align-items:center}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;flex:none;cursor:pointer}
.rb:hover{background:var(--surface-2)}
.rb.call{background:var(--good);border-color:var(--good);color:#fff}
.rb svg{width:19px;height:19px}
.rb.off{opacity:.35;pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qc{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.qc:hover{background:var(--surface-2)}.qc:focus-visible{outline:2px solid var(--primary)}

const nf=new Intl.NumberFormat("fr-FR");

const F=n=>fmt(n)+" F";

const num=v=>parseFloat(String(v??"").replace(/\s/g,"").replace(",","."))||0;

/* ---------- Stockage ---------- */
function saveLocal(){try{localStorage.setItem("socobema",JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("socobema")||"null");if(d)Object.assign(S,d)}catch(e){}}
function errMsg(e){const fc=(e&&e.code)||"";if(fc==="permission-denied")return "Accès refusé : votre accès ne le permet pas, ou il a été suspendu.";if(fc==="unavailable"||fc==="auth/network-request-failed")return "Pas de connexion internet. Réessayez quand le réseau revient.";if(fc==="resource-exhausted")return "Limite gratuite Firebase du jour atteinte. Réessayez demain.";if(fc==="auth/requires-recent-login")return "Par sécurité, verrouillez puis reconnectez-vous avec votre code actuel, et réessayez.";if(fc==="auth/weak-password")return "Le code doit contenir 6 chiffres.";if(e?.code==="invalid_argument")return"Vous n'avez pas le droit de modifier ces données.";if(e?.code==="quota_exceeded")return"Espace de stockage plein : supprimez d'anciennes opérations.";return"Enregistrement impossible pour le moment. Réessayez."}
async function add(col,data){if(!peut(col,"w")){toast(REFUS);return false}data.id=data.id||uid();data.cree=new Date().toISOString();data.par=moi?moi.nom:"";data.majPar=auth&&auth.currentUser?auth.currentUser.uid:null;
  if(db){try{await db.collection(col).doc(data.id).set(data)}catch(e){toast(errMsg(e));return false}}else{S[col].push(data);saveLocal();render()}return true}
async function patch(col,id,data){if(!peut(col,"w")){toast(REFUS);return}data={...data,modPar:moi?moi.nom:"",majPar:auth&&auth.currentUser?auth.currentUser.uid:null};if(db){try{await db.collection(col).doc(id).update(data)}catch(e){toast(errMsg(e))}}else{Object.assign(S[col].find(x=>x.id===id)||{},data);saveLocal();render()}}
async function remove(col,id){if(!peut(col,"d")){toast("Seul le PCA peut supprimer.");return}if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast(errMsg(e))}}else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}}

/* ---------- Calculs ---------- */
function totals(){
  const t={achKg:{},venKg:{},stock:{},achF:0,venF:0,dette:0,creance:0,entrees:0,sorties:0,depenses:0};
  for(const p in PRODUITS){t.achKg[p]=0;t.venKg[p]=0}
  for(const a of S.achats){t.achKg[a.produit]=(t.achKg[a.produit]||0)+num(a.kg);t.achF+=mt(a);if(a.paye)t.sorties+=mt(a);else t.dette+=mt(a)}
  for(const v of S.ventes){t.venKg[v.produit]=(t.venKg[v.produit]||0)+num(v.kg);t.venF+=mt(v);if(v.encaisse)t.entrees+=mt(v);else t.creance+=mt(v)}
  for(const p in PRODUITS)t.stock[p]=t.achKg[p]-t.venKg[p];
  for(const m of S.mouvements){if(m.sens==="entree")t.entrees+=num(m.montant);else{t.sorties+=num(m.montant);t.depenses+=num(m.montant)}}
  t.solde=t.entrees-t.sorties;t.kgTot=Object.values(t.achKg).reduce((a,b)=>a+b,0);
  return t;
}
function journal(){
  const j=[];
  S.achats.filter(a=>a.paye).forEach(a=>j.push({date:a.date,ref:a.ref,lib:"Paiement pesée · "+(membre(a.membre)?.nom||"Producteur"),cat:"Achat "+(PRODUITS[a.produit]?.n||"").toLowerCase(),m:-mt(a)}));
  S.ventes.filter(v=>v.encaisse).forEach(v=>j.push({date:v.date,ref:v.ref,lib:"Encaissement vente · "+v.acheteur,cat:"Vente "+(PRODUITS[v.produit]?.n||"").toLowerCase(),m:mt(v)}));
  S.mouvements.forEach(m=>j.push({id:m.id,date:m.date,ref:m.ref,lib:m.libelle,cat:m.categorie,m:(m.sens==="entree"?1:-1)*num(m.montant)}));
  j.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let s=0;j.forEach(r=>{s+=r.m;r.solde=s});
  return j.reverse();
}

function vAccueil(){
  const t=totals(),vide=!S.membres.length&&!S.achats.length;
  const max=Math.max(1,...Object.keys(PRODUITS).map(p=>t.achKg[p]));
  const alerts=[];
  const nPay=S.achats.filter(a=>!a.paye).length;
  if(nPay)alerts.push(["var(--warn)",`${nPay} pesée${nPay>1?"s":""} à payer aux producteurs`,F(t.dette),"achats"]);

const legendP=()=>`<div class="legend">${Object.values(PRODUITS).map(p=>`<span><i style="background:${p.c}"></i>${p.n}</span>`).join("")}</div>`;
function monthKeys(n){const out=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}return out}
function chartMonths(n){
  const keys=monthKeys(n),data=keys.map(k=>{const o={};for(const p in PRODUITS)o[p]=0;S.achats.forEach(a=>{if((a.date||"").startsWith(k))o[a.produit]=(o[a.produit]||0)+num(a.kg)});return o});
  const tot=data.map(o=>Object.values(o).reduce((a,b)=>a+b,0)),mx=Math.max(...tot);
  if(!mx)return `<p class="note">Aucune pesée sur les ${n} derniers mois.</p>`;
  const step=niceStep(mx/4),top=Math.ceil(mx/step)*step;
  const W=620,H=230,L=58,B=26,T=10,R=8,ch=H-B-T,cw=(W-L-R)/n,bw=Math.min(46,cw*.56);
  let g="";for(let v=0;v<=top+1e-9;v+=step){const y=T+ch-(v/top)*ch;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${kg(v)}</text>`}
  let bars="";data.forEach((o,i)=>{let y=T+ch;const x=L+i*cw+(cw-bw)/2;Object.keys(PRODUITS).forEach(p=>{const h=o[p]/top*ch;if(h>0){y-=h;bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${PRODUITS[p].c}"><title>${PRODUITS[p].n} : ${kg(o[p])}</title></rect>`}});
    const lab=new Date(keys[i]+"-15").toLocaleDateString("fr-FR",{month:"short"});
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${lab}</text>`;
    if(tot[i])bars+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${kg(tot[i])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Volumes collectés par mois">${g}${bars}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

/* ---------- Pisteurs ---------- */
function pStats(x){const L=S.achats.filter(a=>a.pisteur===x.id);const k=L.reduce((s,a)=>s+num(a.kg),0);const av=S.mouvements.filter(m=>m.pisteur===x.id&&m.sens!=="entree").reduce((s,m)=>s+num(m.montant),0);return{n:L.length,kg:k,val:L.reduce((s,a)=>s+mt(a),0),com:k*num(x.commission),av,prods:[...new Set(L.map(a=>a.produit))]}}
function vPisteurs(){
  const list=S.pisteurs.filter(x=>!q||[x.nom,x.zone,x.code,x.tel].join(" ").toLowerCase().includes(q.toLowerCase())).sort((a,b)=>pStats(b).kg-pStats(a).kg);
  const all=S.pisteurs.map(pStats),kT=all.reduce((s,o)=>s+o.kg,0),cT=all.reduce((s,o)=>s+o.com,0),aT=all.reduce((s,o)=>s+o.av,0);
  const t=totals();
  return `<section class="kpis">
    ${kpi("pisteurs","Pisteurs actifs",fmt(S.pisteurs.filter(x=>x.actif!==false).length),`${S.pisteurs.length} enregistrés`)}
    ${kpi("scale","Volume via pisteurs",kg(kT),t.kgTot?Math.round(kT/t.kgTot*100)+" % de la collecte":"—")}
    ${kpi("wallet","Commissions dues",F(cT),"selon le taux de chaque pisteur")}
    ${kpi("caisse","Reste à payer",`<span class="${cT-aT>0?"out":""}">${F(cT-aT)}</span>`,`${F(aT)} déjà avancés`)}
  </section>
  <section class="card">
    <div class="toolbar"><div class="search">${ic("search",16)}<input id="q" type="search" placeholder="Nom, zone, code, téléphone" value="${esc(q)}" aria-label="Rechercher"></div>
      <button class="btn sec" data-export="pisteurs">${ic("dl",16)}Exporter</button><button class="btn" data-form="pisteur">${ic("pisteurs",16)}Nouveau pisteur</button></div>
    ${list.length?`<div class="tbl"><table><thead><tr><th>Code</th><th>Pisteur</th><th>Zone de collecte</th><th class="num">Apports</th><th class="num">Volume</th><th class="num">Taux</th><th class="num">Commission</th><th class="num">Avancé</th><th class="num">Reste</th><th>Statut</th><th></th></tr></thead><tbody>
    ${list.map(x=>{const o=pStats(x),re=o.com-o.av;return `<tr class="click" data-pfiche="${x.id}"><td class="ref">${esc(x.code||"—")}</td><td><b>${esc(x.nom)}</b>${x.tel?`<span class="sub">${esc(x.tel)}</span>`:""}</td><td>${esc(x.zone)}<span class="sub">${o.prods.map(p=>PRODUITS[p]?.n).join(", ")}</span></td><td class="num">${o.n}</td><td class="num">${kg(o.kg)}</td><td class="num">${fmt(x.commission)} F</td><td class="num">${F(o.com)}</td><td class="num">${F(o.av)}</td><td class="num"><b class="${re>0?"out":""}">${F(re)}</b></td>
    <td><button class="tag ${x.actif!==false?"ok":"no"}" data-pact="${x.id}">${x.actif!==false?"Actif":"Suspendu"}</button></td><td><div class="acts"><button class="btn sec sm" data-form="avance" data-for="${x.id}">Avance</button>${delBtn("pisteurs",x.id)}</div></td></tr>`}).join("")}</tbody></table></div>`
    :empty("pisteurs",q?"Aucun résultat":"Aucun pisteur",q?"Aucun pisteur ne correspond.":"Enregistrez les pisteurs qui collectent pour la coopérative. Rattachez ensuite chaque pesée à son pisteur pour calculer ses commissions.")}
  </section>`;
}
/* ---------- Gouvernance ---------- */
const ORGANES=["Conseil d'administration","Comité de gestion","Comité de surveillance","Direction"];
const FONCTIONS={"Conseil d'administration":["Président du Conseil d'administration (PCA)","Vice-président","Secrétaire","Secrétaire adjoint","Trésorier","Trésorier adjoint","Administrateur"],"Comité de gestion":["Président du comité de gestion","Vice-président","Secrétaire","Trésorier","Membre"],"Comité de surveillance":["Président du comité de surveillance","Membre","Commissaire aux comptes"],"Direction":["Directeur / gérant","Comptable","Magasinier","Peseur","Chauffeur","Agent de terrain"]};
function mandat(d){if(!d.fin)return{t:"En cours",c:"ok"};const j=(new Date(d.fin+"T12:00")-new Date())/864e5;return j<0?{t:"Mandat expiré",c:"no"}:j<90?{t:"Expire bientôt",c:"wait"}:{t:"En cours",c:"ok"}}
function dirSorted(){return S.dirigeants.slice().sort((a,b)=>ORGANES.indexOf(a.organe)-ORGANES.indexOf(b.organe)||((FONCTIONS[a.organe]||[]).indexOf(a.fonction)+99)%99-((FONCTIONS[b.organe]||[]).indexOf(b.fonction)+99)%99)}
function vGouvernance(){
  const D=dirSorted(),exp=D.filter(d=>mandat(d).c!=="ok").length;
  const ca=D.filter(d=>d.organe==="Conseil d'administration");
  return `<section class="kpis">
    ${kpi("gouvernance","Conseil d'administration",fmt(ca.length),"administrateurs en fonction")}
    ${kpi("membres","Comités",fmt(D.filter(d=>d.organe==="Comité de gestion"||d.organe==="Comité de surveillance").length),"gestion et surveillance")}
    ${kpi("doc","Direction et personnel",fmt(D.filter(d=>d.organe==="Direction").length),"salariés et agents")}
    ${kpi("caisse","Mandats à renouveler",`<span class="${exp?"out":""}">${fmt(exp)}</span>`,exp?"expirés ou sous 90 jours":"tous en cours")}
  </section>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sec" data-appgo="conseil">Appeler le Conseil</button><button class="btn sec" data-export="dirigeants">${ic("dl",16)}Exporter la liste</button><button class="btn" data-form="dirigeant">${ic("gouvernance",16)}Ajouter un dirigeant</button></div>
  ${D.length?ORGANES.filter(o=>D.some(d=>d.organe===o)).map(o=>`<section class="card"><div class="card-h"><h2>${o}</h2><span class="lbl">${D.filter(d=>d.organe===o).length} personne(s)</span></div><div class="tbl"><table><thead><tr><th>Fonction</th><th>Nom et prénoms</th><th>Téléphone</th><th>Mandat</th><th>Statut</th><th></th></tr></thead><tbody>
    ${D.filter(d=>d.organe===o).map(d=>{const m=mandat(d);return `<tr><td><b>${esc(d.fonction)}</b></td><td>${esc(d.nom)}${d.membre&&membre(d.membre)?`<span class="sub ref">Membre ${esc(membre(d.membre).code||"")}</span>`:""}</td><td>${esc(d.tel||"—")}</td><td style="white-space:nowrap">${d.debut?dfr(d.debut):"—"} → ${d.fin?dfr(d.fin):"…"}</td><td><span class="tag ${m.c}">${m.t}</span></td><td><div class="acts">${delBtn("dirigeants",d.id)}</div></td></tr>`}).join("")}</tbody></table></div></section>`).join("")
  :`<div class="card">${empty("gouvernance","Organes non renseignés","Ajoutez le Président du Conseil d'administration, les administrateurs, les membres du comité de gestion et du comité de surveillance, ainsi que le personnel de direction.",`<button class="btn" data-form="dirigeant">Ajouter un dirigeant</button>`)}</div>`}`;
}


/* ---------- Contrats ---------- */
const CTYPES={pisteur:"Contrat de prestation de pistage et de collecte",producteur:"Contrat d'engagement de livraison",vente:"Contrat de vente de produits agricoles"};
const CSHORT={pisteur:"Pisteur",producteur:"Producteur",vente:"Vente"};
function representant(){const d=S.dirigeants.find(x=>/PCA|Président du Conseil/.test(x.fonction||""))||S.dirigeants.find(x=>/Président du comité de gestion/.test(x.fonction||""));return d?{nom:d.nom,f:d.fonction.replace(/ \(PCA\)/,"")}:{nom:"",f:"Président du Conseil d'administration"}}
function cPartie(c){if(c.type==="pisteur")return pisteur(c.partie)?.nom||"Pisteur supprimé";if(c.type==="producteur")return membre(c.partie)?.nom||"Membre supprimé";return c.acheteur||""}
function cStatut(c){if(c.fin&&new Date(c.fin+"T23:59")<new Date())return{t:"Expiré",c:"no"};return c.signe?{t:"Signé",c:"ok"}:{t:"À signer",c:"wait"}}
function vContrats(){
  const L=S.contrats.slice().sort((a,b)=>(b.cree||"").localeCompare(a.cree||""));
  const pSans=S.pisteurs.filter(x=>x.actif!==false&&!S.contrats.some(c=>c.type==="pisteur"&&c.partie===x.id&&cStatut(c).c!=="no")).length;
  return `<section class="kpis">
    ${kpi("contrats","Contrats",fmt(L.length),"tous types")}
    ${kpi("doc","Signés et en cours",fmt(L.filter(c=>cStatut(c).c==="ok").length),"")}
    ${kpi("caisse","À signer",`<span class="${L.some(c=>cStatut(c).c==="wait")?"out":""}">${fmt(L.filter(c=>cStatut(c).c==="wait").length)}</span>`,"brouillons à faire signer")}
    ${kpi("pisteurs","Pisteurs sans contrat",`<span class="${pSans?"out":""}">${fmt(pSans)}</span>`,"pisteurs actifs")}
  </section>
  <section class="card"><div class="card-h"><h2>Registre des contrats</h2><button class="btn" data-form="contrat">${ic("contrats",16)}Nouveau contrat</button></div>
  ${L.length?`<div class="tbl"><table><thead><tr><th>N°</th><th>Type</th><th>Cocontractant</th><th>Période</th><th>Objet</th><th>Statut</th><th></th></tr></thead><tbody>
  ${L.map(c=>{const st=cStatut(c);return `<tr class="click" data-cview="${c.id}"><td class="ref">${esc(c.ref)}</td><td>${CSHORT[c.type]}</td><td><b>${esc(cPartie(c))}</b></td><td style="white-space:nowrap">${dfr(c.debut)} → ${dfr(c.fin)}</td><td>${c.produit?prodTag(c.produit):"—"}</td><td><button class="tag ${st.c}" data-csign="${c.id}" title="Marquer signé / non signé">${st.t}</button></td><td><div class="acts"><button class="btn icon" data-cview="${c.id}" title="Voir" aria-label="Voir">${ic("doc",16)}</button>${delBtn("contrats",c.id)}</div></td></tr>`}).join("")}</tbody></table></div>`
  :empty("contrats","Aucun contrat","Rédigez un contrat pour un pisteur, un engagement de livraison pour un producteur ou un contrat de vente avec un acheteur. Le texte est généré à partir des fiches enregistrées.",`<button class="btn" data-form="contrat">Rédiger un contrat</button>`)}
  </section>
  <p class="note">Les contrats générés sont des modèles. Faites-les relire par un conseiller juridique ou l'union de coopératives avant la première utilisation.</p>`;
}

  const coop=`<b>SOCOBEMA-COOP-CA</b>, Société Coopérative avec Conseil d'Administration Bengueleman de Mankono, code SNT SC061082, siège BP 87 Mankono, représentée par ${rep.nom?"<b>"+esc(rep.nom)+"</b>, ":ligne+", "}${esc(rep.f)}, dûment habilité, ci-après « la Coopérative »`;

  }
  if(c.type==="producteur"){const m=membre(c.partie)||{};
    partie=`M./Mme <b>${esc(m.nom||ligne)}</b>, membre de la Coopérative sous le code ${esc(m.code||ligne)}, carte producteur n° ${esc(m.carte||ligne)}, section de ${esc(m.section||ligne)}, téléphone ${esc(m.tel||ligne)}, ci-après « le Producteur »`;

  }
  if(c.type==="vente"){

const RESULTATS={joint:["Joint","ok"],absent:["Pas de réponse","wait"],rappeler:["À rappeler","wait"],injoignable:["Injoignable","no"]};
function tousContacts(){
  const out=[];
  dirSorted().forEach(d=>{const m=d.membre&&membre(d.membre);out.push({id:"d_"+d.id,nom:d.nom,tel:d.tel||(m&&m.tel)||"",sub:d.fonction,type:d.organe==="Direction"?"Personnel":"Conseil"})});
  S.membres.forEach(m=>out.push({id:"m_"+m.id,nom:m.nom,tel:m.tel||"",sub:(m.code?m.code+" · ":"")+(m.section||""),type:"Membre"}));
  S.pisteurs.forEach(x=>out.push({id:"p_"+x.id,nom:x.nom,tel:x.tel||"",sub:(x.code?x.code+" · ":"")+(x.zone||""),type:"Pisteur"}));
  return out;
}
const contact=id=>tousContacts().find(x=>x.id===id);
const appelsDe=id=>S.appels.filter(a=>a.pid===id).sort((a,b)=>(b.le||"").localeCompare(a.le||""));
const fdh=iso=>iso?new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" à "+new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";

const initiales=n=>String(n||"?").replace(/^Exemple\s*·\s*/,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
function ctRow(x,extra){const n=waNum(x.tel);return `<div class="ct" data-call="${x.id}"><span class="av t-${x.type||"Membre"}" aria-hidden="true">${esc(initiales(x.nom))}</span><div class="ct-m"><button class="nm" data-call="${x.id}">${esc(x.nom)}</button><span>${esc(x.sub)}</span></div><span class="ct-tel">${x.tel?esc(x.tel):'<span class="tag no" style="cursor:default">Sans numéro</span>'}</span><div class="ct-a">${extra||""}<a class="rb call ${n?"":"off"}" ${n?`href="tel:+${n}"`:""} aria-label="Appeler ${esc(x.nom)}" title="Appel téléphonique">${ic("phone")}</a><a class="rb ${n?"":"off"}" ${n?`href="https://wa.me/${n}" target="_blank" rel="noopener"`:""} aria-label="WhatsApp ${esc(x.nom)}" title="WhatsApp">${ic("chat")}</a></div></div>`}
function jourLabel(d){const t=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);return d===t?"Aujourd'hui":d===y?"Hier":new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function vAppelIndiv(){
  const T=tousContacts(),qq=q.toLowerCase();
  const L=qq?T.filter(x=>(x.nom+" "+x.sub+" "+x.tel+" "+x.type).toLowerCase().includes(qq)).slice(0,60):[];
  const J=S.appels.slice().sort((a,b)=>(b.le||"").localeCompare(a.le||"")),auj=J.filter(a=>(a.le||"").slice(0,10)===today());
  const rap=[],vus=new Set();J.forEach(a=>{if(vus.has(a.pid))return;vus.add(a.pid);if(a.resultat==="rappeler"||a.resultat==="absent")rap.push(a)});
  const rec=[],v2=new Set();J.forEach(a=>{if(!v2.has(a.pid)&&rec.length<8){v2.add(a.pid);const c=contact(a.pid);if(c)rec.push(c)}});
  const bureau=dirSorted().filter(d=>d.organe==="Conseil d'administration").slice(0,8).map(d=>contact("d_"+d.id)).filter(Boolean);
  const qc=x=>`<button class="qc" data-call="${x.id}"><span class="av t-${x.type}">${esc(initiales(x.nom))}</span><b>${esc(x.nom)}</b><span>${esc(x.sub)}</span></button>`;
  const jours={};J.slice(0,80).forEach(a=>{const d=(a.le||"").slice(0,10);(jours[d]=jours[d]||[]).push(a)});
  return `<div class="chipsf">${Object.entries(VUES_APPEL).map(([k,v])=>`<button data-appg="${k}" aria-pressed="${appG===k}">${v}</button>`).join("")}</div>
  <section class="kpis">
    ${kpi("membres","Contacts",fmt(T.length),"Conseil, membres, pisteurs, personnel")}
    ${kpi("doc","Appels aujourd'hui",fmt(auj.length),`${auj.filter(a=>a.resultat==="joint").length} personne(s) jointe(s)`,"g")}
    ${kpi("caisse","À rappeler",fmt(rap.length),rap.length?"dernier appel sans réponse":"personne à rappeler",rap.length?"w":"g")}
    ${kpi("contrats","Sans numéro",fmt(T.filter(x=>!waNum(x.tel)).length),"fiches à compléter",T.some(x=>!waNum(x.tel))?"w":"g")}
  </section>
  <section class="card">
    <div class="toolbar"><div class="search">${ic("search",16)}<input id="q" type="search" placeholder="Nom, numéro, village ou fonction de la personne à appeler" value="${esc(q)}" aria-label="Rechercher une personne à appeler"></div></div>
    ${qq?(L.length?`<div class="ct-list">${L.map(x=>ctRow(x)).join("")}</div>`:empty("search","Aucun contact trouvé","Vérifiez l'orthographe, ou cherchez par numéro ou par village."))
      :`<div class="card-b">
        ${bureau.length?`<span class="lbl">Bureau du Conseil d'administration</span><div class="quick">${bureau.map(qc).join("")}</div>`:""}
        ${rec.length?`<span class="lbl">Appelés récemment</span><div class="quick">${rec.map(qc).join("")}</div>`:""}
        ${!bureau.length&&!rec.length?`<p class="note">Tapez le nom de la personne à appeler. Touchez-la pour ouvrir sa fiche d'appel.</p>`:""}
      </div>`}
  </section>
  ${rap.length?`<section class="card"><div class="card-h"><h2>À rappeler</h2><span class="tag wait" style="cursor:default">${rap.length}</span></div><div class="ct-list">${rap.map(a=>{const c=contact(a.pid)||{id:a.pid,nom:a.nom,tel:a.tel,type:a.type,sub:""};return ctRow({...c,sub:`${RESULTATS[a.resultat][0]} · ${fdh(a.le)}${a.motif?" · "+a.motif:""}`})}).join("")}</div></section>`:""}
  <section class="card"><div class="card-h"><h2>Journal des appels</h2><span class="lbl">${J.length} appel(s)</span></div>
    ${J.length?Object.entries(jours).map(([d,arr])=>`<div class="ct-sec">${esc(jourLabel(d))}</div><div class="tl">${arr.map(a=>{const R=RESULTATS[a.resultat]||["","wait"];return `<div class="tl-i"><span class="tl-dot ${R[1]}" aria-hidden="true">${ic(R[1]==="ok"?"check":"phone")}</span><div class="ct-m"><button class="nm" data-call="${a.pid}">${esc(a.nom)}</button><span>${esc(R[0])}${a.motif?" · "+esc(a.motif):""}${a.note?" · "+esc(a.note):""}</span></div><div class="acts"><span class="tl-h">${new Date(a.le).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span>${delBtn("appels",a.id)}</div></div>`}).join("")}</div>`).join("")
    :empty("phone","Aucun appel noté","Après chaque appel, notez le résultat dans la fiche de la personne : il apparaîtra ici, classé par jour.")}
  </section>`;
}

function enLettres(n){if(!n)return"zéro";const u=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"],d=["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  const c99=x=>{if(x<17)return u[x];if(x<20)return"dix-"+u[x-10];const t=Math.floor(x/10),r=x%10;if(t===7||t===9)return d[t]+(t===7&&r===1?"-et-":"-")+c99(10+r);return d[t]+(r===1&&t<8?"-et-un":r?"-"+u[r]:t===8?"s":"")};
  const c999=x=>{const h=Math.floor(x/100),r=x%100;return (h?(h>1?u[h]+"-cent"+(r?"":"s"):"cent")+(r?"-":""):"")+(r?c99(r):"")};
  let out=[];const g=[[1e9,"milliard"],[1e6,"million"],[1e3,"mille"]];
  for(const[v,w]of g){const q=Math.floor(n/v);if(q){out.push(w==="mille"?(q===1?"mille":c999(q).replace(/(cent|vingt)s$/,"$1")+"-mille"):c999(q)+"-"+w+(q>1?"s":""));n%=v}}
  if(n)out.push(c999(n));return out.join("-")}
