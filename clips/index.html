<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Djassa Clip</title>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : fil vertical plein écran (scroll-snap) + barre du bas ; pages Découvrir / Profil / Publier en surimpression. Ton : nuit, néon chaud. */
:root{--bg:#0F1B33;--panel:#17264A;--sunk:#21325A;--ink:#F4F2EE;--muted:#B4BDD0;--line:#2F4170;--hot:#EE6A1E;--hot-ink:#fff;--sun:#FFD23F;--ok:#3DDC97;--bad:#FF6B6B;
  --f-disp:"Bricolage Grotesque",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--nav:62px;color-scheme:dark}
:root[data-theme="light"]{--bg:#0F1B33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
a{color:var(--sun)}
/* Fil */
#feed{position:fixed;inset:0 0 var(--nav) 0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:calc(100dvh - var(--nav));scroll-snap-align:start;scroll-snap-stop:always;background:#000;display:grid;place-items:center;overflow:hidden}
.slide video{width:100%;height:100%;object-fit:contain;background:#000}
.slide .shade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.cap{position:absolute;left:14px;right:84px;bottom:16px;display:grid;gap:6px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cap .who{font-weight:700;font-size:1.02rem;background:none;border:0;padding:0;text-align:left;color:#fff}
.cap .txt{font-size:.92rem;line-height:1.4;max-height:4.2em;overflow:hidden;overflow-wrap:anywhere}
.cap .txt a{color:#fff;font-weight:700;text-decoration:none}
.cap .meta{font-size:.78rem;color:#ddd}
.rail{position:absolute;right:8px;bottom:22px;display:grid;gap:14px;justify-items:center}
.rb{display:grid;justify-items:center;gap:3px;background:none;border:0;color:#fff;font-size:.74rem;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6);min-width:56px}
.rb .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.rb.on .ic{color:var(--hot)}
.rb svg{width:26px;height:26px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--sunk);border:2px solid #fff;display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--f-disp);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fol{position:relative}
.fol .plus{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--hot);color:#fff;border:0;font-weight:800;line-height:22px;padding:0;font-size:15px}
.mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);right:12px;background:rgba(0,0,0,.45);border:0;border-radius:999px;padding:6px 10px;font-size:.8rem;color:#fff}
.pausei{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pausei svg{width:76px;height:76px;opacity:.75}
.heartpop{position:absolute;width:110px;height:110px;color:var(--hot);pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1.4) translateY(-40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.heartpop{animation:none;opacity:0}}
.ftabs{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.ftabs button{pointer-events:auto;background:none;border:0;color:rgba(255,255,255,.7);font-weight:700;font-size:1rem;padding:4px 2px;border-bottom:2px solid transparent}
.ftabs button[aria-pressed="true"]{color:#fff;border-bottom-color:#fff}
.ftabs .brandn{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--f-disp);font-weight:800;font-size:1.1rem;color:#fff;pointer-events:none;display:flex;align-items:center;gap:8px}
.ftabs .brandn img{width:26px;height:26px;border-radius:7px;display:block}
@media (max-width:540px){.ftabs .brandn{display:none}.ftabs{gap:14px}}
.empty{height:calc(100dvh - var(--nav));display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px;font-family:var(--f-disp)}
/* Barre du bas */
nav.bot{position:fixed;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px);background:#0B1428;border-top:1px solid #1F2E4F;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:6}
nav.bot button{background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:600;padding:6px 0}
nav.bot button[aria-current="true"]{color:#fff}
nav.bot svg{width:24px;height:24px}
nav.bot .add{width:52px;height:34px;border-radius:10px;background:linear-gradient(135deg,#F7893A,#E05A16);color:#fff;box-shadow:0 4px 12px rgba(224,90,22,.35);display:grid;place-items:center;justify-self:center;font-size:1.5rem;font-weight:800;padding:0}
/* Pages */
.page{position:fixed;inset:0 0 var(--nav) 0;overflow-y:auto;background:var(--bg);z-index:3;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.15}
h2{font-size:1.5rem;font-weight:800}
.in{font:inherit;font-size:16px;width:100%;background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px}
.in:focus{outline:2px solid var(--hot);outline-offset:1px}
textarea.in{min-height:90px;resize:vertical}
.btn{font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px}
.btn.hot{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.86rem}
.btn:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.86rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;display:block;width:100%;aspect-ratio:9/16;background:var(--sunk);border:0;padding:0;overflow:hidden;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:6px;bottom:5px;font-size:.74rem;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.tile .hid{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:.75rem;color:#fff}
.urow{display:flex;gap:12px;align-items:center;background:none;border:0;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.urow .av{width:44px;height:44px;border-width:0}
.prof{display:grid;justify-items:center;gap:8px;text-align:center}
.prof .av{width:96px;height:96px;font-size:2rem;border-width:0}
.stats{display:flex;gap:26px;justify-content:center}
.stats div{display:grid}.stats b{font-size:1.1rem}.stats span{font-size:.8rem;color:var(--muted)}
.err{color:var(--bad);min-height:1.2em;margin:0;font-size:.9rem}
.lab{font-size:.84rem;font-weight:600;color:var(--muted);display:grid;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--ink)}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--hot)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--hot);transition:width .2s}
/* Feuilles (commentaires, connexion…) */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;background:var(--panel);border-radius:18px 18px 0 0;display:grid;grid-template-rows:auto 1fr auto;padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .bd{overflow-y:auto;padding:12px 16px;display:grid;gap:12px;align-content:start}
.sheet .ft{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.x{background:none;border:0;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--muted)}
.cm{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start}
.cm .av{width:36px;height:36px;border-width:0;font-size:.9rem}
.cm b{font-size:.82rem;color:var(--muted)}.cm p{margin:2px 0 0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px);background:#fff;color:#000;font-weight:600;padding:10px 16px;border-radius:999px;z-index:30;max-width:calc(100vw - 32px);text-align:center;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.spons{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--sun);color:#1a1200;margin-right:6px}
.cta{position:absolute;left:14px;right:14px;bottom:18px;display:grid;gap:8px}
.cta .btn{width:100%}
.slide.ad img.adimg{width:100%;height:100%;object-fit:contain;background:#000}
.shop{display:inline-flex;gap:6px;align-items:center;background:var(--sun);color:#1a1200;border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:.9rem;width:max-content}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
button:focus-visible,.in:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
/* Identité Djassa Clip : logo complet (écran d'accueil, connexion) */
.djlogo{display:flex;align-items:center;gap:14px;font-family:Poppins,var(--f-disp)}
.djlogo img{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 22px rgba(224,90,22,.35)}
.djlogo .nm{font-size:2rem;font-weight:700;letter-spacing:-1px;line-height:1;color:#fff}.djlogo .nm span{color:#F7893A}
.djlogo .tg{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.62rem;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#C9D1E0}
.djlogo .tg:before{content:"";width:18px;height:2px;border-radius:2px;background:#F7893A}
.djlogo.big{flex-direction:column;text-align:center;gap:22px}.djlogo.big img{width:120px;height:120px;border-radius:28px}
.djlogo.big .nm{font-size:2.6rem}.djlogo.big .tg{justify-content:center}
#splash{position:fixed;inset:0;z-index:999;background:#0F1B33;display:grid;place-items:center;padding:24px;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
.lg-logo{display:flex;justify-content:center;padding:6px 0 4px}.lg-logo .tg{display:none}.lg-logo img{width:52px;height:52px;border-radius:13px}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="djlogo big"><img src="icon-192.png" alt=""><div><div class="nm">Djassa<span>Clip</span></div><div class="tg">Le marché des projets et des articles en ligne</div></div></div></div>
<div class="ftabs" id="ftabs"><span class="brandn"><img src="icon-192.png" alt="" width="26" height="26"><span id="appname"></span></span><button type="button" data-ff="pres" aria-pressed="false">Près de moi</button><button type="button" data-ff="abo" aria-pressed="false">Abonnements</button><button type="button" data-ff="pourtoi" aria-pressed="true">Pour toi</button></div>
<main id="feed" aria-label="Fil de vidéos"></main>
<section class="page" id="p-decouvrir" hidden></section>
<section class="page" id="p-publier" hidden></section>
<section class="page" id="p-profil" hidden></section>
<nav class="bot" aria-label="Navigation">
  <button type="button" data-nav="feed" aria-current="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Accueil</button>
  <button type="button" data-nav="decouvrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Découvrir</button>
  <button type="button" data-nav="publier" aria-label="Publier une vidéo"><span class="add">+</span></button>
  <button type="button" data-nav="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</nav>
<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kfmt=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1).replace(".0","")+" M":n>=1e3?(n/1e3).toFixed(1).replace(".0","")+" k":String(n)};
const ago=iso=>{const s=(Date.now()-new Date(iso))/1e3;return s<60?"à l'instant":s<3600?Math.floor(s/60)+" min":s<86400?Math.floor(s/3600)+" h":s<604800?Math.floor(s/86400)+" j":new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const APP=window.APP||{nom:"Vidéos"}, CL=window.CLOUDINARY||{};
const IC={heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  com:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 4v4C7 9 4 13 3 20c2.5-3.5 6-5 11-5v4l7-7.5z"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h11l-1 3 1 3H7v11z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>'};
document.title=APP.nom; $("#appname").textContent=APP.nom;

let fdb,auth,me=null,meDoc=null,adminUid=null,ready=false;
const users={}; // cache des profils
const likedSet=new Set(), viewed=new Set(), followSet=new Set();
let feedMode="pourtoi", feedList=[], muted=true, lastFeedDoc=null, loadingMore=false, noMore=false;

function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function errMsg(e){const c=(e&&e.code)||"";
  if(c==="permission-denied") return "Action refusée.";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "E-mail ou mot de passe incorrect.";
  if(c==="auth/email-already-in-use") return "Cette adresse a déjà un compte : connectez-vous.";
  if(c==="auth/weak-password") return "Mot de passe trop court (6 caractères minimum).";
  if(c==="auth/invalid-email") return "Adresse e-mail invalide.";
  if(c==="auth/too-many-requests") return "Trop d'essais. Patientez quelques minutes.";
  if(c==="auth/network-request-failed"||c==="unavailable") return "Pas de connexion internet.";
  if(c==="auth/operation-not-allowed"||c==="auth/configuration-not-found") return "La connexion par e-mail n'est pas activée dans Firebase.";
  return "Une erreur est survenue"+(c?" ("+c+")":"")+". Réessayez.";}
const inc=n=>firebase.firestore.FieldValue.increment(n);
const avHTML=(u,cls="av")=>u&&u.photo?`<span class="${cls}"><img src="${esc(u.photo)}" alt=""></span>`:`<span class="${cls}" style="background:hsl(${[...String((u&&u.pseudo)||"?")].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 55% 38%)">${esc(((u&&u.pseudo)||"?").slice(0,1).toUpperCase())}</span>`;
async function getUser(uid){if(users[uid]) return users[uid];try{const s=await fdb.doc("users/"+uid).get();users[uid]=s.exists?{id:uid,...s.data()}:{id:uid,pseudo:"inconnu"}}catch(e){users[uid]={id:uid,pseudo:"…"}}return users[uid]}
const tagsOf=t=>[...new Set((String(t||"").match(/#[\p{L}\p{N}_]{2,30}/gu)||[]).map(x=>x.slice(1).toLowerCase()))].slice(0,10);
const capHTML=t=>esc(t).replace(/#([\p{L}\p{N}_]{2,30})/gu,(m,g)=>`<a href="#" data-tag="${esc(g.toLowerCase())}">#${esc(g)}</a>`).replace(/@([a-z0-9_.]{3,24})/g,(m,g)=>`<a href="#" data-pseudo="${g}">@${g}</a>`);
const cldVideo=pid=>`https://res.cloudinary.com/${CL.cloud}/video/upload/q_auto,vc_auto,w_720/${pid}.mp4`;
const cldPoster=pid=>`https://res.cloudinary.com/${CL.cloud}/video/upload/so_1,w_480,q_auto/${pid}.jpg`;
/* ---------- Préférences de l'appareil + profil d'intérêts (recommandations personnalisées, sans rien envoyer) ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let prefs=LS.get("k-prefs",{eco:"auto",ville:""});
const conn=navigator.connection||{};
const isEco=()=>prefs.eco==="on"||(prefs.eco==="auto"&&(conn.saveData||/(^|-)2g|3g/.test(conn.effectiveType||"")));
/* Qualité adaptée : 480p léger sur réseau faible, 720p sinon (la vidéo source reste en haute qualité chez Cloudinary). */
const vsrc=v=>v.pid&&CL.cloud?`https://res.cloudinary.com/${CL.cloud}/video/upload/${isEco()?"q_auto:low,vc_auto,w_480,br_500k":"q_auto,vc_auto,w_720"}/${v.pid}.mp4`:v.url;
let INT=LS.get("k-int",{t:{},u:{},seen:{}});
function bump(v,w){if(!v) return;(v.tags||[]).forEach(t=>INT.t[t]=Math.max(-10,Math.min(50,(INT.t[t]||0)+w)));INT.u[v.uid]=Math.max(-10,Math.min(60,(INT.u[v.uid]||0)+w*1.5));
  const kk=Object.keys(INT.t);if(kk.length>300) kk.sort((a,b)=>Math.abs(INT.t[a])-Math.abs(INT.t[b])).slice(0,100).forEach(k=>delete INT.t[k]);LS.set("k-int",INT)}
function affinity(v){const t=(v.tags||[]).reduce((s,x)=>s+(INT.t[x]||0),0), u=INT.u[v.uid]||0;return Math.max(.3,Math.min(5,1+t/12+u/10))}
function markSeen(id){INT.seen[id]=Date.now();const k=Object.keys(INT.seen);if(k.length>800) k.sort((a,b)=>INT.seen[a]-INT.seen[b]).slice(0,300).forEach(x=>delete INT.seen[x]);LS.set("k-int",INT)}
const visible=v=>!v.supprime&&!v.cache;

/* ================= FIL ================= */
const io=new IntersectionObserver(es=>{es.forEach(e=>{const sl=e.target,v=sl.querySelector("video");
  if(sl.dataset.pub&&e.isIntersecting&&e.intersectionRatio>=.6&&!pubSeen.has(sl.dataset.pub)){pubSeen.add(sl.dataset.pub);fdb.doc("pubs/"+sl.dataset.pub).update({impressions:inc(1)}).catch(()=>{})}
  if(!v){if(e.isIntersecting&&e.intersectionRatio>=.6) document.querySelectorAll("#feed video").forEach(x=>x.pause());return}
  if(e.isIntersecting&&e.intersectionRatio>=.6){activate(sl)} else {v.pause()}})},{root:null,threshold:[0,.6,1]});
function activate(sl){

function uploadCld(file,onp,kind){return new Promise((ok,ko)=>{
  const fd=new FormData();fd.append("file",file);fd.append("upload_preset",CL.preset);fd.append("folder",(CL.dossier||"clips")+"/"+me.uid);
  const x=new XMLHttpRequest();x.open("POST",`https://api.cloudinary.com/v1_1/${CL.cloud}/${kind||"video"}/upload`);
  x.upload.onprogress=e=>{if(e.lengthComputable) onp(e.loaded/e.total)};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(_){}
    if(x.status>=200&&x.status<300&&j.public_id) ok(j); else ko({cld:"Envoi refusé par l'hébergeur vidéo"+(j.error&&j.error.message?" : "+j.error.message:"")+"."})};
  x.onerror=()=>ko({cld:"Envoi interrompu (connexion). Réessayez avec un meilleur réseau."});
  x.send(fd)})}

    <p class="muted" style="margin:0;font-size:.8rem">${esc(APP.nom)} n'intervient pas dans ces paiements : vérifiez le nom du bénéficiaire avant de valider.</p></div></div>`);
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>toast("Numéro copié"),()=>toast(b.dataset.copy)));
}
function openBoost(id){
  const v=feedList.find(x=>x.id===id)||{};
  openDlg(`<div class="sheet"><div class="hd"><h3>⚡ Booster la vidéo</h3><button class="x" type="button" data-close>×</button></div><form class="bd" id="bo-f">
    <p class="muted" style="margin:0">La vidéo passe en tête du fil « Pour toi » avec la mention « Sponsorisé ».${boosted(v)?` Boost en cours jusqu'au ${esc(v.boostFin)}.`:""}</p>
    <label class="lab">Durée<select class="in" id="bo-j"><option value="1">1 jour</option><option value="3">3 jours</option><option value="7" selected>7 jours</option><option value="30">30 jours</option></select></label>
    <label class="lab">Montant payé par le créateur (FCFA)<input class="in" id="bo-m" inputmode="numeric" value="${(window.TARIFS||{}).boost7||5000}"></label>
    <label class="lab">Payé par<select class="in" id="bo-mode"><option>Orange Money</option><option>MTN MoMo</option><option>Moov Money</option><option>Wave</option><option>Espèces</option></select></label>

  $("#bo-f").onsubmit=async e=>{e.preventDefault();const j=+$("#bo-j").value,m=Math.round(+$("#bo-m").value.replace(/\D/g,"")||0);
    const start=boosted(v)?v.boostFin:tday(), fin=addD(start,j), b=fdb.batch();

    try{await b.commit();v.boostFin=fin;closeDlg();toast("Boost actif jusqu'au "+fin)}catch(x){$("#bo-err").textContent=errMsg(x)}};
}
async function openRevenus(){
  openDlg(`<div class="sheet" style="max-height:94dvh"><div class="hd"><h3>💰 Revenus & publicités</h3><button class="x" type="button" data-close>×</button></div><div class="bd" id="rv-b"><p class="muted">Chargement…</p></div></div>`);
  const [rs,ps]=await Promise.all([fdb.collection("revenus").orderBy("le","desc").limit(300).get(),fdb.collection("pubs").limit(100).get()]);
  const R=rs.docs.map(d=>({id:d.id,...d.data()})), Pb=ps.docs.map(d=>({id:d.id,...d.data()})), t=tday(), m=t.slice(0,7), y=t.slice(0,4);
  const sum=f=>R.filter(f).reduce((s,x)=>s+(+x.montant||0),0);
  $("#rv-b").innerHTML=`<div class="row" style="gap:10px">${[["Ce mois",sum(x=>(x.jour||"").startsWith(m))],["Cette année",sum(x=>(x.jour||"").startsWith(y))],["Publicités (année)",sum(x=>x.type==="pub"&&(x.jour||"").startsWith(y))],["Boosts (année)",sum(x=>x.type==="boost"&&(x.jour||"").startsWith(y))]].map(([l,v])=>`<div class="card" style="flex:1;min-width:130px;gap:2px"><span class="muted" style="font-size:.78rem">${l}</span><b style="font-size:1.2rem">${fc(v)}</b></div>`).join("")}</div>
    <div class="row" style="justify-content:space-between"><h3>Publicités</h3><button class="btn sm hot" type="button" id="rv-new">+ Nouvelle publicité</button></div>
    ${Pb.length?Pb.sort((a,b)=>(b.fin||"").localeCompare(a.fin||"")).map(p=>{const on=p.actif&&(!p.fin||p.fin>=t);return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(p.annonceur)} · ${esc(p.titre)}</b><span class="pill" style="${on?"color:var(--ok)":""}">${on?"En ligne":"Terminée"}</span></div>
      <div class="muted" style="font-size:.85rem">${esc(p.debut||"")} → ${esc(p.fin||"")} · ${fc(p.prix)} · ${kfmt(p.impressions)} vues · ${kfmt(p.clics)} clics${p.impressions?` (${((+p.clics||0)/p.impressions*100).toFixed(1)} %)`:""}</div>
      <div class="row"><button class="btn sm" type="button" data-pubrep="${p.id}">Envoyer le bilan</button>${on?`<button class="btn sm" type="button" data-pubstop="${p.id}">Arrêter</button>`:""}</div></div>`}).join(""):`<p class="muted">Aucune publicité. Proposez des annonces aux commerces de votre région : le fil affiche une annonce toutes les ${PUB_EVERY} vidéos.</p>`}
    <h3>Encaissements</h3>${R.length?`<div class="card" style="gap:6px">${R.slice(0,40).map(x=>`<div class="row" style="justify-content:space-between;font-size:.88rem"><span>${esc(x.jour)} · ${x.type==="pub"?"Publicité":x.type==="boost"?"Boost":"Autre"} ${esc(x.libelle||"")} <span class="muted">${esc(x.mode||"")}</span></span><b>${fc(x.montant)}</b></div>`).join("")}</div>`:`<p class="muted">Aucun encaissement.</p>`}
    <button class="btn" type="button" id="rv-add">+ Autre encaissement</button>`;
  $("#rv-new").onclick=newPub;
  $("#rv-add").onclick=async()=>{const l=prompt("Libellé (ex. partenariat, soutien…)");if(!l) return;const mt=Math.round(+String(prompt("Montant (FCFA)")||"").replace(/\D/g,""));if(!mt) return;
    await fdb.collection("revenus").add({type:"autre",libelle:l.slice(0,60),montant:mt,jour:tday(),le:new Date().toISOString()});openRevenus()};
  document.querySelectorAll("[data-pubstop]").forEach(b=>b.onclick=async()=>{await fdb.doc("pubs/"+b.dataset.pubstop).update({actif:false});openRevenus()});
  document.querySelectorAll("[data-pubrep]").forEach(b=>b.onclick=()=>{const p=Pb.find(x=>x.id===b.dataset.pubrep);const d=String(p.tel||"").replace(/\D/g,"");
    window.open("https://wa.me/"+(d.length===10?"225"+d:d)+"?text="+encodeURIComponent(`Bilan de votre publicité « ${p.titre} » sur ${APP.nom} (${p.debut} → ${p.fin}) : ${p.impressions||0} vues, ${p.clics||0} clics. Merci de votre confiance !`),"_blank","noopener")});
}
function newPub(){
  openDlg(`<div class="sheet" style="max-height:94dvh"><div class="hd"><h3>Nouvelle publicité</h3><button class="x" type="button" data-close>×</button></div><form class="bd" id="pu-f" novalidate>
    <label class="lab">Annonceur<input class="in" id="pu-a" maxlength="60" placeholder="Ex. Quincaillerie Traoré"></label>
    <label class="lab">Téléphone de l'annonceur (pour le bilan)<input class="in" id="pu-tel" type="tel"></label>
    <label class="lab">Titre de l'annonce<input class="in" id="pu-t" maxlength="70" placeholder="Ex. Ciment à 5 800 F le sac"></label>
    <label class="lab">Texte<textarea class="in" id="pu-x" maxlength="200"></textarea></label>
    <label class="lab">Bouton<select class="in" id="pu-b"><option>Contacter</option><option>Commander</option><option>Appeler</option><option>En savoir plus</option></select></label>
    <label class="lab">Lien du bouton : numéro WhatsApp ou adresse web<input class="in" id="pu-l" placeholder="07 00 00 00 00 ou https://…"></label>
    <label class="btn" style="text-align:center">🖼 Image ou vidéo de l'annonce<input type="file" id="pu-file" accept="image/*,video/*" hidden></label><p class="muted" id="pu-fn" style="margin:0"></p>
    <div class="row"><label class="lab" style="flex:1">Début<input class="in" id="pu-d" type="date" value="${tday()}"></label><label class="lab" style="flex:1">Fin<input class="in" id="pu-f2" type="date" value="${addD(tday(),7)}"></label></div>
    <label class="lab">Prix payé (FCFA)<input class="in" id="pu-p" inputmode="numeric" value="${(window.TARIFS||{}).pub7||10000}"></label>
    <label class="lab">Payé par<select class="in" id="pu-mode"><option>Orange Money</option><option>MTN MoMo</option><option>Moov Money</option><option>Wave</option><option>Espèces</option><option>Virement</option></select></label>
    <div class="bar" id="pu-bar" hidden><i></i></div><p class="err" id="pu-err"></p><button class="btn hot" type="submit">Mettre en ligne</button></form></div>`);
  let file=null; $("#pu-file").onchange=e=>{file=e.target.files[0];$("#pu-fn").textContent=file?file.name:""};
  $("#pu-f").onsubmit=async e=>{e.preventDefault();const er=$("#pu-err");const a=$("#pu-a").value.trim(),ti=$("#pu-t").value.trim(),l=$("#pu-l").value.trim(),d=$("#pu-d").value,f=$("#pu-f2").value,px=Math.round(+$("#pu-p").value.replace(/\D/g,"")||0);
    if(!a||!ti){er.textContent="Indiquez l'annonceur et le titre.";return} if(!file){er.textContent="Ajoutez une image ou une vidéo.";return} if(!l){er.textContent="Indiquez le lien du bouton.";return} if(f<d){er.textContent="La fin est avant le début.";return}
    if(!CL.cloud){er.textContent="Hébergement Cloudinary non configuré.";return}
    const isV=/^video\//.test(file.type), btn=e.target.querySelector("[type=submit]"); btn.disabled=true; $("#pu-bar").hidden=false;
    try{const r=await uploadCld(file,p=>$("#pu-bar").firstElementChild.style.width=Math.round(p*100)+"%",isV?"video":"image");
      const url=isV?cldVideo(r.public_id):`https://res.cloudinary.com/${CL.cloud}/image/upload/q_auto,w_720/${r.public_id}`;
      const b=fdb.batch(), ref=fdb.collection("pubs").doc();
      b.set(ref,{annonceur:a,tel:$("#pu-tel").value.trim(),titre:ti,texte:$("#pu-x").value.trim(),bouton:$("#pu-b").value,lien:l,media:isV?"video":"image",url,poster:isV?cldPoster(r.public_id):"",debut:d,fin:f,prix:px,actif:true,impressions:0,clics:0,le:new Date().toISOString()});
      if(px) b.set(fdb.collection("revenus").doc(),{type:"pub",pubId:ref.id,libelle:a,montant:px,mode:$("#pu-mode").value,jour:tday(),le:new Date().toISOString()});
      await b.commit(); toast("Publicité en ligne"); openRevenus();
    }catch(x){er.textContent=x&&x.cld?x.cld:errMsg(x);btn.disabled=false}};
}

async function openAdmin(){
  openDlg(`<div class="sheet" style="max-height:92dvh"><div class="hd"><h3>Modération</h3><button class="x" type="button" data-close>×</button></div><div class="bd" id="ad-l"><p class="muted">Chargement…</p></div></div>`);
  const s=await fdb.collection("reports").where("traite","==",false).limit(100).get();
  const R=s.docs.map(d=>({id:d.id,...d.data()})); const byV={}; R.forEach(r=>(byV[r.videoId]=byV[r.videoId]||[]).push(r));
  const L=$("#ad-l"); if(!R.length){L.innerHTML=`<p class="muted">Aucun signalement en attente. 👍</p>`;return}
  L.innerHTML=(await Promise.all(Object.entries(byV).map(async([vid,rs])=>{const v=await fdb.doc("videos/"+vid).get();const d=v.exists?v.data():null;const u=d?await getUser(d.uid):null;
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>${rs.length} signalement(s)</b>${d&&d.cache?`<span class="pill">masquée</span>`:""}</div>
      <div class="muted">${[...new Set(rs.map(r=>r.motif))].map(esc).join(" · ")}</div>
      ${d?`<video src="${esc(d.url)}" poster="${esc(d.poster)}" controls playsinline preload="none" style="width:100%;max-height:40dvh;background:#000;border-radius:8px"></video><div>@${esc(u.pseudo)} : ${esc(d.legende||"")}</div>`:`<p class="muted">Vidéo supprimée.</p>`}
      <div class="row">${d?`<button class="btn sm hot" type="button" data-ad="hide" data-v="${vid}" data-r="${rs.map(r=>r.id).join(",")}">Masquer la vidéo</button><button class="btn sm" type="button" data-ad="ban" data-u="${d.uid}" data-v="${vid}" data-r="${rs.map(r=>r.id).join(",")}">Masquer + bloquer @${esc(u.pseudo)}</button>`:""}<button class="btn sm" type="button" data-ad="ok" data-r="${rs.map(r=>r.id).join(",")}">Rien à signaler</button></div></div>`}))).join("");
  L.querySelectorAll("[data-ad]").forEach(b=>b.onclick=async()=>{const bb=fdb.batch();
    if(b.dataset.ad!=="ok") bb.update(fdb.doc("videos/"+b.dataset.v),{cache:true});
    if(b.dataset.ad==="ban") bb.update(fdb.doc("users/"+b.dataset.u),{bloque:true});
    b.dataset.r.split(",").forEach(id=>bb.update(fdb.doc("reports/"+id),{traite:true,decision:b.dataset.ad,par:me.uid}));
    try{await bb.commit();toast("Décision enregistrée");b.closest(".card").remove()}catch(e){toast(errMsg(e))}});
}

async function loadMe(){ if(!me){meDoc=null;return} try{const s=await fdb.doc("users/"+me.uid).get();meDoc=s.exists?{id:me.uid,...s.data()}:null;if(meDoc) users[me.uid]=meDoc}catch(_){meDoc=null} }
async function loadFollows(){followSet.clear();if(!me) return;try{const s=await fdb.collection("follows").where("de","==",me.uid).limit(500).get();s.docs.forEach(d=>followSet.add(d.data().vers))}catch(_){}}
async function init(){
  const C=window.FIREBASE_CONFIG;
  if(!window.firebase||!C||!C.apiKey||/COLLER/.test(C.apiKey)){$("#feed").innerHTML=`<div class="empty"><div><b>${esc(APP.nom)}</b>Le site n'est pas encore relié à sa base de données (config.js).</div></div>`;return}
  firebase.initializeApp(C); fdb=firebase.firestore(); auth=firebase.auth();
  try{fdb.settings({experimentalForceLongPolling:true,merge:true})}catch(_){}
  fdb.doc("config/admin").get().then(s=>{adminUid=s.exists?s.data().uid:null}).catch(()=>{});
  let first=true;
  auth.onAuthStateChanged(async u=>{
    me=u; if(signingUp) return;
    await loadMe();
    if(me&&!meDoc){ // compte sans profil (inscription interrompue) : terminer l'inscription
      openLogin("Choisissez votre pseudo pour terminer l'inscription.",true);}
    if(me&&meDoc&&!adminUid){ // le tout premier inscrit devient administrateur (modération)
      try{await fdb.doc("config/admin").set({uid:me.uid,le:new Date().toISOString()});adminUid=me.uid}catch(_){} }
    await loadFollows();
    if(first){first=false;const q=new URLSearchParams(location.search);
      if(q.get("v")){await loadFeed();openSingle(q.get("v"))} else if(q.get("u")){await loadFeed();openProfileByPseudo(q.get("u"))} else loadFeed()}
    else if(!$("#p-profil").hidden&&me) renderProfile(profUid||me.uid);
  });
}
if("serviceWorker" in navigator&&location.protocol==="https:") addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
init();
})();
